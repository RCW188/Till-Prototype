function renderProductForm(p, catId){
  const isNew = !p;
  const idBase = isNew ? 'new-'+catId : 'edit-'+p.id;
  const color = p ? p.color : (state.categories.find(c=>c.id===catId)?.color || '#0D9488');
  return `
  <div class="edit-form">
    <div class="field-row">
      <div class="field" style="margin-bottom:10px;"><label>Name</label><input type="text" id="${idBase}-name" value="${esc(p?p.name:'')}" placeholder="Item name"></div>
      <div class="field" style="margin-bottom:10px;max-width:120px;"><label>Price</label><input type="number" step="0.01" min="0" id="${idBase}-price" value="${p?p.price:''}" placeholder="0.00"></div>
    </div>
    <div class="field-row">
      <div class="field" style="margin-bottom:10px;"><label>Details (optional)</label><input type="text" id="${idBase}-details" value="${esc(p?p.details:'')}" placeholder="Shown as a subtitle on the button"></div>
      <div class="field" style="margin-bottom:10px;max-width:140px;"><label>SKU / barcode</label><input type="text" id="${idBase}-sku" value="${esc(p?p.sku||'':'')}" placeholder="Optional"></div>
    </div>
    <div class="field" style="margin-bottom:6px;">
      <label>Button colour</label>
      <div class="swatch-picker">
        ${PALETTE.map(c=>`<div class="swatch-opt ${c.toLowerCase()===color.toLowerCase()?'sel':''}" style="background:${c}" onclick="pickSwatch('${idBase}','${c}')" id="${idBase}-swopt-${c.replace('#','')}"></div>`).join('')}
        <input type="color" id="${idBase}-color" value="${color}" style="width:26px;height:26px;padding:0;border-radius:7px;" oninput="clearSwatchSel('${idBase}')">
      </div>
    </div>
    ${state.business.stockTrackingEnabled ? `
    <div class="toggle-row" style="border-top:none;padding-top:0;">
      <div class="tinfo"><div class="tname">Track stock for this item</div><div class="tdesc">Deducts on sale, blocks sale when out of stock.</div></div>
      <div class="switch ${p&&p.trackStock?'on':''}" id="${idBase}-trackstock-sw" onclick="this.classList.toggle('on')"></div>
    </div>
    <div class="field-row">
      <div class="field" style="margin-bottom:10px;"><label>Current stock</label><input type="number" min="0" id="${idBase}-stock" value="${p?p.stock:0}"></div>
      <div class="field" style="margin-bottom:10px;"><label>Low stock alert below</label><input type="number" min="0" id="${idBase}-lowstock" value="${p?p.lowStockThreshold:5}"></div>
    </div>` : ''}
    ${state.business.ageRestrictionEnabled ? `
    <div class="toggle-row" style="border-top:none;padding-top:0;">
      <div class="tinfo"><div class="tname">Age-restricted (18+)</div><div class="tdesc">Triggers a Challenge 25 prompt at the till, logged for licensing evidence.</div></div>
      <div class="switch ${p&&p.ageRestricted?'on':''}" id="${idBase}-agerestrict-sw" onclick="this.classList.toggle('on')"></div>
    </div>` : ''}
    <div class="form-actions">
      <button class="btn btn-ghost btn-sm" onclick="${isNew?`state.cp.addingProduct=null;`:`state.cp.editingProductId=null;`}render()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="${isNew?`cpSaveNewProduct('${catId}','${idBase}')`:`cpSaveProduct('${p.id}','${idBase}')`}">Save item</button>
    </div>
  </div>`;
}
function pickSwatch(idBase, color){
  document.getElementById(idBase+'-color').value = color;
  document.querySelectorAll(`[id^="${idBase}-swopt-"]`).forEach(el=>el.classList.remove('sel'));
  document.getElementById(idBase+'-swopt-'+color.replace('#','')).classList.add('sel');
}
function clearSwatchSel(idBase){ document.querySelectorAll(`[id^="${idBase}-swopt-"]`).forEach(el=>el.classList.remove('sel')); }

/* ---------- Till layout tab (customisable block grid editor) ---------- */
function renderCpLayout(){
  const cats = state.categories;
  if(!cats.length){
    return `
    <div class="cp-topbar"><div><h1>Till layout</h1><div class="sub">Design exactly what appears on the till, category by category.</div></div></div>
    <div class="card section-card" style="text-align:center;padding:40px 24px;">
      <h3 style="margin-bottom:8px;">Add a category first</h3>
      <p style="color:var(--text-soft);font-size:13.5px;">Till layout is built one category page at a time — add a category from the ${esc(typeLabel())} tab to get started.</p>
    </div>`;
  }
  if(!state.cp.layoutCatId || !cats.some(c=>c.id===state.cp.layoutCatId)) state.cp.layoutCatId = cats[0].id;
  const cat = cats.find(c=>c.id===state.cp.layoutCatId);
  const blocks = categoryBlocks(cat);
  const rows = layoutRowCount(cat);
  const occ = {};
  blocks.forEach(bl=> blockCells(bl).forEach(c=> occ[c.x+','+c.y]=true));
  let emptyCells = '';
  for(let y=0;y<rows;y++){
    for(let x=0;x<LAYOUT_COLS;x++){
      if(occ[x+','+y]) continue;
      emptyCells += `<button class="layout-cell-empty" style="grid-column:${x+1};grid-row:${y+1};" onclick="cpLayoutAddBlock('${cat.id}',${x},${y})" title="Add a block here">+</button>`;
    }
  }
  const blockTiles = blocks.map(bl=>{
    const d = blockDisplay(bl); if(!d) return '';
    return `<button class="layout-cell-block" style="grid-column:${bl.x+1}/span ${bl.w};grid-row:${bl.y+1}/span ${bl.h};background:${d.color};" onclick="cpLayoutEditBlock('${cat.id}','${bl.id}')">
      <div class="lb-type">${esc(blockTypeMeta(bl.type).label)}</div>
      <div class="lb-name">${esc(d.label)}</div>
    </button>`;
  }).join('');
  return `
  <div class="cp-topbar">
    <div><h1>Till layout</h1><div class="sub">Tap an empty cell to add a button, tap a button to edit, resize or remove it. Each category is its own page on the till.</div></div>
  </div>
  <div class="cat-tabs" style="margin-bottom:16px;">
    ${cats.map(c=>`<button class="cat-tab ${c.id===cat.id?'active':''}" onclick="cpLayoutSelectCategory('${c.id}')"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}
  </div>
  <div class="card section-card" style="padding:16px;">
    <div class="layout-editor-grid" style="--layout-cols:${LAYOUT_COLS};">
      ${blockTiles}${emptyCells}
    </div>
  </div>`;
}
function cpLayoutSelectCategory(id){ state.cp.layoutCatId = id; render(); }
function cpLayoutAddBlock(catId, x, y){
  const otherCat = state.categories.find(c=>c.id!==catId) || null;
  const firstProduct = state.products[0] || null;
  state.cp.blockEditor = {
    open:true, catId, blockId:null, x, y, w:1, h:1, type:'product',
    color: firstProduct ? (firstProduct.color||'#0D9488') : '#0D9488',
    label: firstProduct ? firstProduct.name : 'Product',
    productId: firstProduct ? firstProduct.id : '',
    categoryId: otherCat ? otherCat.id : ''
  };
  render();
}
function cpLayoutEditBlock(catId, blockId){
  const cat = state.categories.find(c=>c.id===catId); if(!cat) return;
  const bl = categoryBlocks(cat).find(b=>b.id===blockId); if(!bl) return;
  state.cp.blockEditor = {
    open:true, catId, blockId, x:bl.x, y:bl.y, w:bl.w, h:bl.h, type:bl.type,
    color: bl.color, label: bl.label,
    productId: bl.productId || (state.products[0]?.id||''),
    categoryId: bl.categoryId || (state.categories.find(c=>c.id!==catId)?.id||'')
  };
  render();
}
function cpLayoutCloseEditor(){ state.cp.blockEditor = null; render(); }
function cpLayoutSetType(t){
  const be = state.cp.blockEditor; be.type = t;
  if(t==='product'){
    const p = state.products.find(x=>x.id===be.productId) || state.products[0] || null;
    be.productId = p ? p.id : '';
    be.label = p ? p.name : 'Product';
    be.color = p ? (p.color||'#0D9488') : '#0D9488';
  } else if(t==='category'){
    const c = state.categories.find(x=>x.id===be.categoryId && x.id!==be.catId) || state.categories.find(x=>x.id!==be.catId) || null;
    be.categoryId = c ? c.id : '';
    be.label = c ? c.name : 'Category';
    be.color = c ? c.color : state.business.primaryColor;
  } else {
    be.label = blockTypeMeta(t).label;
    be.color = state.business.accentColor;
  }
  render();
}
function cpLayoutSetProduct(id){
  const be = state.cp.blockEditor; be.productId = id;
  const p = state.products.find(x=>x.id===id); if(!p) return;
  be.label = p.name;
  const labelEl = document.getElementById('lbe-label'); if(labelEl) labelEl.value = p.name;
  cpLayoutPickColor(p.color || '#0D9488');
}
function cpLayoutSetCategoryRef(id){
  const be = state.cp.blockEditor; be.categoryId = id;
  const c = state.categories.find(x=>x.id===id); if(!c) return;
  be.label = c.name;
  const labelEl = document.getElementById('lbe-label'); if(labelEl) labelEl.value = c.name;
  cpLayoutPickColor(c.color);
}
function cpLayoutPickColor(color){
  const be = state.cp.blockEditor; be.color = color;
  document.querySelectorAll('.lbe-swatch').forEach(el=>el.classList.remove('sel'));
  const target = document.getElementById('lbe-swatch-'+color.replace('#',''));
  if(target) target.classList.add('sel');
}
function cpLayoutResize(dw, dh){
  const be = state.cp.blockEditor;
  be.w = Math.min(LAYOUT_COLS, Math.max(1, be.w+dw));
  be.h = Math.min(LAYOUT_MAX_H, Math.max(1, be.h+dh));
  render();
}
function cpLayoutSaveBlock(){
  const be = state.cp.blockEditor;
  const cat = state.categories.find(c=>c.id===be.catId); if(!cat) return;
  if(!isAreaFree(cat, be.x, be.y, be.w, be.h, be.blockId)){ toast('That space overlaps another block — shrink it or pick a different spot.'); return; }
  if(be.type==='product' && !be.productId){ toast('Add a product to your catalogue first.'); return; }
  if(be.type==='category' && !be.categoryId){ toast('Add another category first.'); return; }
  const label = (be.label||'').trim() || blockTypeMeta(be.type).label;
  const data = {
    type: be.type, x: be.x, y: be.y, w: be.w, h: be.h, color: be.color, label,
    productId: be.type==='product' ? be.productId : undefined,
    categoryId: be.type==='category' ? be.categoryId : undefined
  };
  const blocks = categoryBlocks(cat);
  if(be.blockId){
    const existing = blocks.find(b=>b.id===be.blockId);
    Object.assign(existing, data);
    if(data.productId===undefined) delete existing.productId;
    if(data.categoryId===undefined) delete existing.categoryId;
  } else {
    blocks.push({ id: uid(), ...data });
  }
  state.cp.blockEditor = null;
  render();
  toast('Till layout updated.');
}
function cpLayoutDeleteBlock(){
  const be = state.cp.blockEditor; if(!be || !be.blockId) return;
  if(!confirm('Remove this block from the till?')) return;
  const cat = state.categories.find(c=>c.id===be.catId); if(!cat) return;
  cat.blocks = categoryBlocks(cat).filter(b=>b.id!==be.blockId);
  state.cp.blockEditor = null;
  render();
}
function renderLayoutBlockModal(){
  const be = state.cp.blockEditor;
  const isNew = !be.blockId;
  return `
  <div class="modal-overlay" onclick="if(event.target===this) cpLayoutCloseEditor()">
    <div class="modal" style="max-width:440px;">
      <div class="modal-head"><h2>${isNew?'Add a block':'Edit block'}</h2><button class="close" onclick="cpLayoutCloseEditor()">✕</button></div>
      <div class="modal-body">
        <div class="field">
          <label>This block</label>
          <div class="chip-row">
            ${BLOCK_TYPES.map(t=>`<button class="chip ${be.type===t.id?'sel-primary':''}" onclick="cpLayoutSetType('${t.id}')">${esc(t.label)}</button>`).join('')}
          </div>
          <div class="hint">${esc(blockTypeMeta(be.type).desc)}</div>
        </div>
        ${be.type==='product' ? `
        <div class="field">
          <label>Item</label>
          <select id="lbe-product" onchange="cpLayoutSetProduct(this.value)">
            ${state.products.length ? state.categories.map(c=>{
              const opts = state.products.filter(p=>p.categoryId===c.id).map(p=>`<option value="${p.id}" ${p.id===be.productId?'selected':''}>${esc(p.name)} — ${fmtMoney(p.price)}</option>`).join('');
              return opts ? `<optgroup label="${esc(c.name)}">${opts}</optgroup>` : '';
            }).join('') : `<option value="">No items in your catalogue yet</option>`}
          </select>
        </div>` : ''}
        ${be.type==='category' ? `
        <div class="field">
          <label>Goes to category</label>
          <select id="lbe-category" onchange="cpLayoutSetCategoryRef(this.value)">
            ${state.categories.map(c=>`<option value="${c.id}" ${c.id===be.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}
          </select>
        </div>` : ''}
        <div class="field">
          <label>Label on the till</label>
          <input type="text" id="lbe-label" value="${esc(be.label)}" oninput="state.cp.blockEditor.label=this.value" maxlength="40">
        </div>
        <div class="field">
          <label>Colour</label>
          <div class="swatch-picker">
            ${PALETTE.map(c=>`<div class="swatch-opt lbe-swatch ${be.color.toLowerCase()===c.toLowerCase()?'sel':''}" id="lbe-swatch-${c.replace('#','')}" style="background:${c}" onclick="cpLayoutPickColor('${c}')"></div>`).join('')}
            <input type="color" value="${be.color}" style="width:26px;height:26px;padding:0;border-radius:7px;" oninput="cpLayoutPickColor(this.value)">
          </div>
        </div>
        <div class="field" style="margin-bottom:6px;">
          <label>Size on the till</label>
          <div class="size-stepper-row">
            <div class="size-stepper"><span>Width</span><button class="icon-btn" style="width:30px;height:30px;" onclick="cpLayoutResize(-1,0)">−</button><span class="sv">${be.w}</span><button class="icon-btn" style="width:30px;height:30px;" onclick="cpLayoutResize(1,0)">+</button></div>
            <div class="size-stepper"><span>Height</span><button class="icon-btn" style="width:30px;height:30px;" onclick="cpLayoutResize(0,-1)">−</button><span class="sv">${be.h}</span><button class="icon-btn" style="width:30px;height:30px;" onclick="cpLayoutResize(0,1)">+</button></div>
          </div>
        </div>
        <div class="form-actions" style="justify-content:space-between;">
          ${!isNew ? `<button class="btn btn-warn btn-sm" onclick="cpLayoutDeleteBlock()">Remove</button>` : '<span></span>'}
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost btn-sm" onclick="cpLayoutCloseEditor()">Cancel</button>
            <button class="btn btn-primary btn-sm" onclick="cpLayoutSaveBlock()">Save block</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}
function cpNewCategory(){
  const name = prompt('Category name:'); if(!name) return;
  state.categories.push({id:uid(), name:name.trim(), color: PALETTE[state.categories.length % PALETTE.length], blocks:[]});
  render();
}
function cpSaveCategory(id){
  const cat = state.categories.find(c=>c.id===id);
  cat.name = document.getElementById('cat-name-'+id).value.trim() || cat.name;
  cat.color = document.getElementById('cat-color-'+id).value;
  state.cp.editingCategoryId = null;
  render();
}
function cpDeleteCategory(id){
  const hasProducts = state.products.some(p=>p.categoryId===id);
  if(hasProducts){ alert('Move or delete the items in this category first.'); return; }
  if(!confirm('Delete this category?')) return;
  state.categories = state.categories.filter(c=>c.id!==id);
  state.categories.forEach(cat=> categoryBlocks(cat)); // prunes any "category link" block that pointed at the deleted category
  if(state.cp.layoutCatId===id) state.cp.layoutCatId = null;
  render();
}
function cpAddProduct(catId){ state.cp.addingProduct = catId; state.cp.editingProductId=null; render(); }
function readProductFormFields(idBase){
  const name = document.getElementById(idBase+'-name').value.trim();
  const price = parseFloat(document.getElementById(idBase+'-price').value);
  const details = document.getElementById(idBase+'-details').value.trim();
  const sku = document.getElementById(idBase+'-sku').value.trim();
  const color = document.getElementById(idBase+'-color').value;
  const trackStockEl = document.getElementById(idBase+'-trackstock-sw');
  const trackStock = trackStockEl ? trackStockEl.classList.contains('on') : false;
  const stock = document.getElementById(idBase+'-stock') ? parseInt(document.getElementById(idBase+'-stock').value)||0 : 0;
  const lowStockThreshold = document.getElementById(idBase+'-lowstock') ? parseInt(document.getElementById(idBase+'-lowstock').value)||5 : 5;
  const ageEl = document.getElementById(idBase+'-agerestrict-sw');
  const ageRestricted = ageEl ? ageEl.classList.contains('on') : false;
  return {name, price, details, sku, color, trackStock, stock, lowStockThreshold, ageRestricted};
}
function cpSaveNewProduct(catId, idBase){
  const f = readProductFormFields(idBase);
  if(!f.name || isNaN(f.price) || f.price<0){ alert('Please enter a valid name and price.'); return; }
  const newId = uid();
  state.products.push({ id: newId, categoryId: catId, ...f });
  const cat = state.categories.find(c=>c.id===catId);
  if(cat){
    const {x,y} = nextFreeCell(cat, 1, 1);
    categoryBlocks(cat).push({ id: uid(), type:'product', productId:newId, x, y, w:1, h:1, color: f.color, label: f.name });
  }
  state.cp.addingProduct = null;
  render();
}
function cpSaveProduct(id, idBase){
  const p = state.products.find(x=>x.id===id);
  const f = readProductFormFields(idBase);
  if(!f.name || isNaN(f.price) || f.price<0){ alert('Please enter a valid name and price.'); return; }
  Object.assign(p, f);
  state.cp.editingProductId = null;
  render();
}
function cpDeleteProduct(id){
  if(!confirm('Delete this item?')) return;
  state.products = state.products.filter(p=>p.id!==id);
  state.categories.forEach(cat=> categoryBlocks(cat)); // prunes any block that pointed at the deleted item
  render();
}

/* --- Stock control tab --- */
function renderCpStock(){
  const b = state.business;
  if(!b.stockTrackingEnabled){
    return `
    <div class="cp-topbar"><div><h1>Stock control</h1><div class="sub">Live stock levels, low-stock alerts, stock takes and wastage recording.</div></div></div>
    <div class="card section-card" style="text-align:center;padding:40px 24px;">
      <h3 style="margin-bottom:8px;">Stock tracking is off</h3>
      <p style="color:var(--text-soft);font-size:13.5px;margin-bottom:18px;max-width:420px;margin-left:auto;margin-right:auto;">Turn it on, then flag which items to track from the ${typeLabel().toLowerCase()} tab. Items you don't track behave exactly as before.</p>
      <button class="btn btn-primary" onclick="cpEnableStock()">Turn on stock tracking</button>
    </div>`;
  }
  const tracked = state.products.filter(p=>p.trackStock);
  const low = tracked.filter(p=>p.stock<=p.lowStockThreshold);
  return `
  <div class="cp-topbar"><div><h1>Stock control</h1><div class="sub">${tracked.length} item${tracked.length===1?'':'s'} tracked · ${low.length} low or out of stock.</div></div>
    <button class="btn btn-ghost btn-sm" onclick="cpDisableStock()">Turn off stock tracking</button>
  </div>
  ${low.length ? `<div class="card section-card" style="border-color:var(--warn);">
    <h3>Low stock</h3><div class="sc-sub">Below their configured threshold.</div>
    ${low.map(p=>`<div class="bar-row"><div class="bn">${esc(p.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,p.stock/(p.lowStockThreshold||1)*100)}%;background:var(--danger);"></div></div><div class="bv">${p.stock} left</div></div>`).join('')}
  </div>`:''}
  <div class="card section-card">
    <h3>All tracked items</h3><div class="sc-sub">Adjust stock, run a stock take, or record wastage.</div>
    ${tracked.length ? `<table class="data-table"><thead><tr><th>Item</th><th>SKU</th><th>Stock</th><th>Alert below</th><th></th></tr></thead><tbody>
      ${tracked.map(p=>`
        <tr>
          <td>${esc(p.name)}</td><td style="font-family:var(--font-mono);">${esc(p.sku||'—')}</td>
          <td style="font-family:var(--font-mono);font-weight:700;${p.stock<=p.lowStockThreshold?'color:var(--danger);':''}">${p.stock}</td>
          <td style="font-family:var(--font-mono);">${p.lowStockThreshold}</td>
          <td>
            <div class="prod-actions">
              <button class="icon-btn" title="Adjust +1" onclick="cpAdjustStock('${p.id}',1)">+</button>
              <button class="icon-btn" title="Adjust -1" onclick="cpAdjustStock('${p.id}',-1)">−</button>
              <button class="btn btn-secondary btn-sm" onclick="cpStockTake('${p.id}')">Stock take</button>
              <button class="btn btn-warn btn-sm" onclick="cpWastage('${p.id}')">Wastage</button>
            </div>
          </td>
        </tr>`).join('')}
    </tbody></table>` : `<p style="color:var(--text-mute);font-size:13px;">No items are flagged for tracking yet — edit an item in the ${typeLabel().toLowerCase()} tab and switch on “Track stock”.</p>`}
  </div>`;
}
function cpEnableStock(){ state.business.stockTrackingEnabled = true; render(); toast('Stock tracking turned on.'); }
function cpDisableStock(){ if(!confirm('Turn off stock tracking? Existing stock numbers are kept but no longer enforced.')) return; state.business.stockTrackingEnabled = false; render(); }
function cpAdjustStock(id, delta){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  p.stock = Math.max(0, p.stock + delta); render();
}
function cpStockTake(id){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  const v = prompt(`Stock take for ${p.name} — enter the counted quantity:`, p.stock);
  if(v===null) return;
  const n = parseInt(v); if(isNaN(n)||n<0){ alert('Enter a valid whole number.'); return; }
  p.stock = n; render(); toast('Stock take recorded.');
}
function cpWastage(id){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  const v = prompt(`Record wastage for ${p.name} — how many to remove?`, 1);
  if(v===null) return;
  const n = parseInt(v); if(isNaN(n)||n<=0){ alert('Enter a valid whole number.'); return; }
  const reason = prompt('Reason (optional):', 'Damaged') || 'Not given';
  p.stock = Math.max(0, p.stock - n);
  render();
  toast(`${n} × ${p.name} written off (${reason}).`);
}

    <button class="btn btn-primary" onclick="cpAddCustomerForm()">+ Add customer</button>

  <div class="card section-card">

      <div class="switch ${b.loyaltyEnabled?'on':''}" onclick="cpToggleLoyalty()"></div>

    ${b.loyaltyEnabled ? `

function lastCashUpTime(){
  return state.cashUps.length ? state.cashUps[state.cashUps.length-1].time : new Date(0);
}
function calcExpectedCashSince(since){
  let cash = 0;
  state.sales.forEach(s=>{
    if(s.time > since) cash += (s.cashNet||0);
    (s.refunds||[]).forEach(r=>{ if(r.time > since && r.tender==='cash') cash -= r.total; });
  });
  return Math.round(cash*100)/100;
}
function buildInsights(){
  const insights = [];
  const sales = state.sales;
  if(!sales.length){ insights.push({text:'Ring up a few sales and this panel will start surfacing plain-English observations from your own data — nothing sent anywhere.'}); return insights; }
  const byCat = {};
  sales.forEach(sale => sale.items.forEach(it=>{
    const prod = state.products.find(p=>p.id===it.productId || p.name===it.name);
    const catName = prod ? (state.categories.find(c=>c.id===prod.categoryId)?.name || 'Other') : 'Other';
    byCat[catName] = (byCat[catName]||0) + (it.lineTotal!=null?it.lineTotal:it.price*it.qty);
  }));
  const bestCat = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  if(bestCat) insights.push({text:`“${bestCat[0]}” is your best-selling category this session, at ${fmtMoney(bestCat[1])}.`});
  const byHour = {};
  sales.forEach(s=>{ const h=s.time.getHours(); byHour[h]=(byHour[h]||0)+1; });
  const busiest = Object.entries(byHour).sort((a,b)=>b[1]-a[1])[0];
  if(busiest) insights.push({text:`Your busiest hour so far is ${busiest[0]}:00–${(+busiest[0]+1)%24}:00, with ${busiest[1]} sale${busiest[1]===1?'':'s'}.`});
  if(state.business.stockTrackingEnabled){
    const low = state.products.filter(p=>p.trackStock && p.stock<=p.lowStockThreshold);
    if(low.length) insights.push({text:`Stock running low on ${low.map(p=>p.name).join(', ')} — worth a reorder soon.`});
  }
  const refundCount = sales.reduce((a,s)=>a+(s.refunds||[]).length,0);
  if(refundCount>0) insights.push({text:`${refundCount} refund${refundCount===1?'':'s'} recorded this session — check the reason codes below if a pattern emerges.`});
  const avgSale = sales.reduce((a,s)=>a+s.total,0)/sales.length;
  insights.push({text:`Average sale value is ${fmtMoney(avgSale)} across ${sales.length} transaction${sales.length===1?'':'s'}.`});
  return insights;
}

/* --- Cash up / Z-report --- */
let cashUpDeclared = 0;
function openCashUp(){
  cashUpDeclared = 0;
  const expected = calcExpectedCashSince(lastCashUpTime());
  const modalHtml = `
  <div class="modal-overlay" id="cashup-overlay" onclick="if(event.target===this) closeCashUp()">
    <div class="modal">
      <div class="modal-head"><h2>Cash up / Z-report</h2><button class="close" onclick="closeCashUp()">✕</button></div>
      <div class="modal-body">
        <div class="due-box"><div class="lbl">Expected cash in drawer</div><div class="amt">${fmtMoney(expected)}</div><div class="sub">Since the last cash-up</div></div>
        <div class="field"><label>Declared cash counted</label><input type="number" step="0.01" min="0" id="cashup-declared" value="0" oninput="patchCashUpVariance(${expected})"></div>
        <div class="change-box" id="cashup-variance-box"><span class="lbl">Variance</span><span class="amt">${fmtMoney(-expected)}</span></div>
        <button class="btn btn-primary btn-lg btn-block" onclick="confirmCashUp(${expected})">Record cash-up</button>
      </div>
    </div>
  </div>`;
  const div = document.createElement('div'); div.innerHTML = modalHtml;
  document.getElementById('app').appendChild(div.firstElementChild);
}
function patchCashUpVariance(expected){
  const declared = parseFloat(document.getElementById('cashup-declared').value)||0;
  const variance = Math.round((declared-expected)*100)/100;
  const box = document.getElementById('cashup-variance-box');
  box.classList.toggle('neg', variance<0);
  box.querySelector('.amt').textContent = (variance>=0?'+':'')+fmtMoney(variance);
}
function closeCashUp(){ document.getElementById('cashup-overlay')?.remove(); }
function confirmCashUp(expected){
  const declared = parseFloat(document.getElementById('cashup-declared').value)||0;
  requireManagerPin('Confirm cash-up of '+fmtMoney(declared), ()=>{
    state.cashUps.push({id:uid(), time:new Date(), staffName:state.currentStaff?.name||'', expected, declared, variance:Math.round((declared-expected)*100)/100});
    closeCashUp();
    render();
    toast('Cash-up recorded.');
  });
}

/* --- Report exports --- */
function csvCell(v){ v = String(v??''); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportSalesCsv(){
  const rows = [['Transaction','Time','Staff','Item','Qty','Unit price','Line total','Payment method','Sale total','Refunded']];
  state.sales.forEach((s,idx)=>{
    s.items.forEach(it=>{
      rows.push([ idx+1, s.time.toLocaleString('en-GB'), s.staffName, it.name, it.qty,
        it.price.toFixed(2), (it.lineTotal!=null?it.lineTotal:it.price*it.qty).toFixed(2), s.method, s.total.toFixed(2), (s.refundedTotal||0).toFixed(2) ]);
    });
  });
  const csv = rows.map(r=>r.map(csvCell).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  downloadBlob(blob, sanitizeName(state.business.name)+'-sales-'+dateStamp()+'.csv');
}
function exportSalesPdf(){
  const b = state.business;
  const totalRevenue = state.sales.reduce((s,x)=>s+x.total,0);
  const count = state.sales.length;
  const avg = count ? totalRevenue/count : 0;
  const byMethod = {cash:0,card:0,split:0,'split-ways':0};
  state.sales.forEach(s=>byMethod[s.method]=(byMethod[s.method]||0)+s.total);
  const win = window.open('', '_blank');
  if(!win){ alert('Please allow pop-ups to export the PDF, then use your browser’s Save as PDF option.'); return; }
  const rowsHtml = state.sales.slice().reverse().map(s=>`
    <tr>
      <td>${s.time.toLocaleString('en-GB')}</td>
      <td>${esc(s.staffName)}</td>
      <td>${s.items.map(i=>esc(i.qty+' × '+i.name)).join('<br>')}</td>
      <td style="text-transform:capitalize">${s.method}</td>
      <td style="text-align:right;font-family:monospace">${fmtMoney(s.total)}</td>
    </tr>`).join('');
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Sales report — ${esc(b.name)}</title>
    <style>
      body{font-family:'Inter',system-ui,Arial,sans-serif;color:#161A1F;margin:40px;}
      h1{font-size:22px;margin:0 0 2px;} .meta{color:#6B7280;font-size:13px;margin-bottom:24px;}
      .stats{display:flex;gap:14px;margin-bottom:24px;}
      .stat{border:1px solid #E2E4E9;border-radius:12px;padding:14px 18px;flex:1;}
      .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#9AA1AC;font-weight:700;}
      .stat .v{font-size:22px;font-weight:800;font-family:monospace;margin-top:4px;}
      table{width:100%;border-collapse:collapse;font-size:12.5px;}
      th{text-align:left;border-bottom:2px solid #161A1F;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
      td{padding:8px 10px;border-bottom:1px solid #EEF0F3;vertical-align:top;}
      .pay{margin-bottom:24px;font-size:13px;color:#5B6270;}
    </style></head><body>
      <h1>${esc(b.name)}</h1>
      <div class="meta">Sales report · Generated ${new Date().toLocaleString('en-GB')}</div>
      <div class="stats">
        <div class="stat"><div class="l">Revenue</div><div class="v">${fmtMoney(totalRevenue)}</div></div>
        <div class="stat"><div class="l">Transactions</div><div class="v">${count}</div></div>
        <div class="stat"><div class="l">Average sale</div><div class="v">${fmtMoney(avg)}</div></div>
      </div>
      <div class="pay">Cash ${fmtMoney(byMethod.cash)} · Card ${fmtMoney(byMethod.card)} · Split ${fmtMoney(byMethod.split)} · Split ways ${fmtMoney(byMethod['split-ways'])}</div>
      <table><thead><tr><th>Time</th><th>Staff</th><th>Items</th><th>Payment</th><th style="text-align:right">Total</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table>
      <script>window.onload=function(){setTimeout(function(){window.print();},250);};<\/script>
    </body></html>`);
  win.document.close();
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportCatalogCsv(){
  const rows = [['Category','Name','Price','SKU','Track stock','Stock','Age restricted']];
  state.products.forEach(p=>{
    const cat = state.categories.find(c=>c.id===p.categoryId);
    rows.push([cat?cat.name:'', p.name, p.price.toFixed(2), p.sku||'', p.trackStock?'yes':'no', p.trackStock?p.stock:'', p.ageRestricted?'yes':'no']);
  });
  const csv = rows.map(r=>r.map(csvCell).join(',')).join('\n');
  downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8;'}), sanitizeName(state.business.name)+'-catalogue-'+dateStamp()+'.csv');
}
function sanitizeName(n){ return (n||'business').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function dateStamp(){ const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }

/* --- Refunds --- */
function openRefundModal(saleId){
  const sale = state.sales.find(s=>s.id===saleId); if(!sale) return;
  state.refund = { open:true, saleId, qtys:{}, reason:'Customer changed mind', tender: sale.method==='card'?'card':'cash' };
  render();
}
function closeRefundModal(){ state.refund = {open:false, saleId:null, qtys:{}, reason:'Customer changed mind', tender:'cash'}; render(); }
function setRefundQty(idx, val){ state.refund.qtys[idx] = Math.max(0, parseInt(val)||0); render(); }
function setRefundReason(v){ state.refund.reason = v; }
function setRefundTender(t){ state.refund.tender = t; render(); }
function refundTotalNow(sale){
  let total = 0;
  sale.items.forEach((it,idx)=>{
    const q = Math.min(it.qty - (it.refundedQty||0), state.refund.qtys[idx]||0);
    total += (it.lineTotal/it.qty) * q;
  });
  return Math.round(total*100)/100;
}
function renderRefundModal(){
  const sale = state.sales.find(s=>s.id===state.refund.saleId); if(!sale) return '';
  const total = refundTotalNow(sale);
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeRefundModal()">
    <div class="modal modal-lg">
      <div class="modal-head"><h2>Refund sale</h2><button class="close" onclick="closeRefundModal()">✕</button></div>
      <div class="modal-body">
        <p style="font-size:12.5px;color:var(--text-mute);margin-bottom:14px;">Linked to the original transaction from ${sale.time.toLocaleString('en-GB')}. Choose how many of each line to refund.</p>
        <table class="data-table" style="margin-bottom:16px;">
          <thead><tr><th>Item</th><th>Sold</th><th>Already refunded</th><th>Refund qty</th></tr></thead>
          <tbody>
            ${sale.items.map((it,idx)=>{
              const already = it.refundedQty||0; const remaining = it.qty - already;
              return `<tr><td>${esc(it.name)}</td><td>${it.qty}</td><td>${already}</td><td><input type="number" min="0" max="${remaining}" style="width:70px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--border);" value="${state.refund.qtys[idx]||0}" oninput="setRefundQty(${idx}, this.value)" ${remaining<=0?'disabled':''}></td></tr>`;
            }).join('')}
          </tbody>
        </table>
        <div class="field-row">
          <div class="field">
            <label>Reason</label>
            <select id="refund-reason" onchange="setRefundReason(this.value)">
              ${['Customer changed mind','Faulty item','Wrong item given','Duplicate charge','Other'].map(r=>`<option ${state.refund.reason===r?'selected':''}>${r}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Refund to</label>
            <div class="chip-row">
              <button class="chip ${state.refund.tender==='cash'?'sel-primary':''}" onclick="setRefundTender('cash')">Cash</button>
              <button class="chip ${state.refund.tender==='card'?'sel-primary':''}" onclick="setRefundTender('card')">Card</button>
            </div>
          </div>
        </div>
        <div class="due-box" style="margin-bottom:16px;"><div class="lbl">Refund total</div><div class="amt">${fmtMoney(total)}</div></div>
        <button class="btn btn-danger btn-lg btn-block" ${total<=0?'disabled':''} onclick="confirmRefund()">Process refund</button>
      </div>
    </div>
  </div>`;
}
function confirmRefund(){
  const sale = state.sales.find(s=>s.id===state.refund.saleId); if(!sale) return;
  const total = refundTotalNow(sale);
  if(total<=0) return;
  const reasonEl = document.getElementById('refund-reason');
  const reason = reasonEl ? reasonEl.value : state.refund.reason;
  const tender = state.refund.tender;
  const qtys = {...state.refund.qtys};
  requireManagerPin('Approve refund of '+fmtMoney(total), ()=>{
    sale.items.forEach((it,idx)=>{ const q = qtys[idx]||0; if(q>0) it.refundedQty = (it.refundedQty||0)+q; });
    sale.refunds = sale.refunds || [];
    sale.refunds.push({id:uid(), time:new Date(), reason, tender, total, staffName:state.currentStaff?.name||''});
    sale.refundedTotal = Math.round(((sale.refundedTotal||0)+total)*100)/100;
    if(state.business.stockTrackingEnabled){
      sale.items.forEach((it,idx)=>{
        const q = qtys[idx]||0; if(q<=0) return;
        const p = state.products.find(x=>x.id===it.productId);
        if(p && p.trackStock) p.stock += q;
      });
    }
    closeRefundModal();
    render();
    toast(`Refund of ${fmtMoney(total)} processed and logged.`);
  });
}

  </div>`;

/* ============================ CUSTOMER-FACING DISPLAY ============================ */
function renderCustomerDisplay(){
  const b = state.business;
  const totals = cartTotals();
  const lvl = brandStage('display');
  return `
  <div class="display-screen lvl-${lvl}">
    <div class="dlogo">${logoNode()}</div>
    <h1>${esc(b.name)}</h1>
    ${state.cart.length ? `
    <div class="dlines">
      ${state.cart.map(i=>`<div class="dline"><span>${i.qty} × ${esc(i.name)}</span><span>${fmtMoney(lineGross(i))}</span></div>`).join('')}
    </div>
    <div class="dtotal">${fmtMoney(totals.total)}</div>
    <div class="dsub">incl. VAT</div>
    ` : `<div class="dsub" style="font-size:20px;margin-top:20px;">Welcome — your order will appear here.</div>`}
  </div>`;
}
function initCustomerDisplayIfNeeded(){
  const params = new URLSearchParams(location.search);
  if(params.get('display')==='1'){
    const loaded = loadState();
    if(loaded){ state.business = loaded.business; state.cart = loaded.cart; state.categories = loaded.categories; }
    state.screen = 'display';
    applyTheme();
    render();
    window.addEventListener('storage', (e)=>{
      if(e.key===STORAGE_KEY){
        const loaded = loadState();
        if(loaded){ state.business = loaded.business; state.cart = loaded.cart; state.categories = loaded.categories; render(); }
      }
    });
    return true;
  }
  return false;
}

/* ============================ INIT ============================ */
(function init(){
  const isDisplay = initCustomerDisplayIfNeeded();
  if(isDisplay) return;
  // Every load starts fresh from the beginning of setup — no resuming a
  // previous session. (The customer-display window above is the exception:
  // it reads localStorage live, mid-session, to mirror the active sale.)
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  state = seedState();
  applyTheme();
  render();
  window.addEventListener('online', ()=>{ state.online = true; if(state.screen==='till') render(); });
  window.addEventListener('offline', ()=>{ state.online = false; if(state.screen==='till') render(); });
  setInterval(()=>{ const el = document.getElementById('th-clock'); if(el) el.textContent = new Date().toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'}); }, 30000);
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline mode still works via local storage even if the service worker can't register */ });
    });
  }
  // Read-only debug accessor (browser console convenience only — never used internally).
  window.__debugState = () => state;
})();
</script>
