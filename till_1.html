
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>The Cashier System — Till</title>
<meta name="theme-color" content="#0D9488">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Merriweather:wght@400;700;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-alt:#EEF0F3; --border:#E2E4E9;
  --text:#161A1F; --text-soft:#5B6270; --text-mute:#9AA1AC;
  --primary:#0D9488; --primary-dark:#0B7C72; --primary-light:#E4F5F3;
  --accent:#F59E0B; --accent-dark:#D9860A;
  --danger:#DC2626; --danger-light:#FDEAEA; --success:#16A34A; --success-light:#E9F8EF;
  --warn:#B45309; --warn-light:#FEF3E0;
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --shadow-s:0 1px 2px rgba(20,25,35,.06);
  --shadow-m:0 6px 16px rgba(20,25,35,.08);
  --shadow-l:0 24px 48px rgba(20,25,35,.18);
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#181B20; --surface-alt:#20242B; --border:#2C313A;
  --text:#F2F4F6; --text-soft:#AEB5C0; --text-mute:#767E8A;
  --primary-light:rgba(45,212,191,.14);
  --danger-light:rgba(220,38,38,.16); --success-light:rgba(22,163,74,.16); --warn-light:rgba(180,83,9,.2);
  --shadow-s:0 1px 2px rgba(0,0,0,.3); --shadow-m:0 6px 20px rgba(0,0,0,.4); --shadow-l:0 24px 60px rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0E1013; --surface:#181B20; --surface-alt:#20242B; --border:#2C313A;
    --text:#F2F4F6; --text-soft:#AEB5C0; --text-mute:#767E8A;
    --primary-light:rgba(45,212,191,.14);
    --danger-light:rgba(220,38,38,.16); --success-light:rgba(22,163,74,.16); --warn-light:rgba(180,83,9,.2);
    --shadow-s:0 1px 2px rgba(0,0,0,.3); --shadow-m:0 6px 20px rgba(0,0,0,.4); --shadow-l:0 24px 60px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
#app{min-height:100vh;}
button,input,select,textarea{font-family:inherit;color:inherit;}
::selection{background:var(--primary-light);}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em;}
p{margin:0;}
a{color:inherit;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--radius-s);border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;transition:transform .08s ease,background .15s ease,box-shadow .15s ease,border-color .15s ease;white-space:nowrap;background:none;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-s);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border);}
.btn-secondary:hover{background:var(--surface-alt);}
.btn-ghost{background:transparent;color:var(--text-soft);}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-danger{background:var(--danger-light);color:var(--danger);}
.btn-danger:hover{background:#fbdcdc;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--accent-dark);}
.btn-warn{background:var(--warn-light);color:var(--warn);}
.btn-block{width:100%;}
.btn-lg{padding:15px 22px;font-size:15px;border-radius:var(--radius-m);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.icon-btn{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:15px;transition:background .15s;}
.icon-btn:hover{background:var(--surface-alt);}
.icon-btn.on{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark);}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:12.5px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em;}
.field input[type=text],.field input[type=number],.field input[type=password],.field input[type=email],.field input[type=tel],.field select,.field textarea{
  padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-size:14.5px;color:var(--text);transition:border-color .15s;width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);outline:none;}
.field .hint{font-size:12px;color:var(--text-mute);font-weight:500;}
.field-row{display:flex;gap:14px;}
.field-row .field{flex:1;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:9px 14px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;}
.chip:hover{background:var(--surface-alt);}
.chip.sel{background:var(--text);border-color:var(--text);color:var(--surface);}
.chip.sel-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--surface-alt);}
.toggle-row:first-child{border-top:none;}
.toggle-row .tinfo{flex:1;}
.toggle-row .tname{font-weight:700;font-size:13.5px;}
.toggle-row .tdesc{font-size:12px;color:var(--text-mute);margin-top:2px;}
.brand-stage-list{display:flex;flex-direction:column;margin-bottom:14px;}
.brand-stage-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--surface-alt);flex-wrap:wrap;}
.brand-stage-row:first-child{border-top:none;}
.bsr-info{flex:1;min-width:130px;}
.bsr-name{font-weight:700;font-size:13.5px;}
.bsr-desc{font-size:11.5px;color:var(--text-mute);margin-top:2px;}
.switch{position:relative;width:42px;height:24px;border-radius:100px;background:var(--surface-alt);border:1.5px solid var(--border);cursor:pointer;flex-shrink:0;transition:background .15s;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:var(--shadow-s);transition:transform .15s;}
.switch.on{background:var(--primary);border-color:var(--primary);}
.switch.on::after{transform:translateX(18px);}
input[type=color]{-webkit-appearance:none;appearance:none;width:54px;height:40px;border:1.5px solid var(--border);border-radius:10px;padding:2px;cursor:pointer;background:var(--surface);}
input[type=color]::-webkit-color-swatch{border-radius:7px;border:none;}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;}

/* ---------- Cards / layout ---------- */
.card{background:var(--surface);border-radius:var(--radius-m);border:1px solid var(--border);}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.badge-admin{background:var(--primary-light);color:var(--primary-dark);}
.badge-cashier{background:var(--surface-alt);color:var(--text-soft);}
.badge-warn{background:var(--warn-light);color:var(--warn);}
.badge-danger{background:var(--danger-light);color:var(--danger);}
.tagline{font-size:12.5px;color:var(--text-mute);font-weight:600;}
.tagline b{color:var(--text-soft);}

/* ---------- Offline / status pill ---------- */
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:100px;font-size:11.5px;font-weight:700;background:var(--success-light);color:var(--success);}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--success);}
.status-pill.off{background:var(--warn-light);color:var(--warn);}
.status-pill.off .dot{background:var(--warn);}

/* ---------- Welcome ---------- */
.welcome-card{max-width:480px;width:100%;text-align:center;padding:44px 36px;}
.welcome-mark{width:64px;height:64px;border-radius:18px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:22px;margin:0 auto 20px;}
.welcome-card h1{font-size:24px;margin-bottom:8px;}
.welcome-card p{color:var(--text-soft);font-size:14.5px;line-height:1.55;margin-bottom:22px;}
.welcome-actions{display:flex;flex-direction:column;gap:10px;}
.welcome-charter{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px;}
.welcome-charter span{font-size:11px;font-weight:700;color:var(--text-mute);background:var(--surface-alt);padding:5px 10px;border-radius:100px;}

/* ---------- Wizard ---------- */
.wizard-shell{max-width:580px;width:100%;padding:0;overflow:hidden;}
.wizard-steps{display:flex;padding:22px 32px 0;gap:8px;}
.wizard-step-dot{flex:1;height:4px;border-radius:3px;background:var(--surface-alt);}
.wizard-step-dot.active{background:var(--primary);}
.wizard-step-dot.done{background:var(--primary);opacity:.5;}
.wizard-body{padding:28px 32px 32px;max-height:78vh;overflow-y:auto;}
.wizard-eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--primary);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.wizard-body h2{font-size:22px;margin-bottom:6px;}
.wizard-body>.sub{color:var(--text-soft);font-size:14px;margin-bottom:24px;line-height:1.5;}
.wizard-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;}
.type-search{position:relative;margin-bottom:12px;}
.type-search input{width:100%;padding:11px 14px 11px 36px;border-radius:11px;border:1.5px solid var(--border);font-size:14px;background:var(--surface);color:var(--text);}
.type-search input:focus{border-color:var(--primary);outline:none;}
.type-search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.55;pointer-events:none;}
.type-count-hint{font-size:11.5px;color:var(--text-mute);margin:-4px 0 10px;}
.type-grid-scroll{max-height:320px;overflow-y:auto;margin-bottom:18px;padding-right:2px;}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.type-group-label{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mute);font-weight:700;margin-top:16px;}
.type-group-label:first-child{margin-top:0;}
.type-empty{grid-column:1/-1;text-align:center;color:var(--text-mute);font-size:13px;padding:28px 0;}
.type-opt{border:1.5px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;text-align:left;background:var(--surface);transition:border-color .15s,background .15s;}
.type-opt:hover{background:var(--surface-alt);}
.type-opt.sel{border-color:var(--primary);background:var(--primary-light);}
.type-opt .lbl{font-weight:700;font-size:13.5px;}
.type-opt .desc{font-size:11.5px;color:var(--text-soft);margin-top:2px;}
.logo-upload{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.logo-preview{width:72px;height:72px;border-radius:16px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1.5px dashed var(--border);flex-shrink:0;}
.logo-preview img{width:100%;height:100%;object-fit:cover;}
.brand-image-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;}
.brand-image-slot .logo-preview{width:72px;height:52px;border-radius:10px;}
.brand-image-slot .logo-preview[style*="width:96px"]{height:52px;}
.color-row{display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap;}
.color-item{display:flex;align-items:center;gap:10px;}
.color-item .lbl{font-size:13px;font-weight:600;}
.preview-strip{border:1.5px solid var(--border);border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;background:var(--surface-alt);}
.preview-strip .pv-logo{width:38px;height:38px;border-radius:9px;background:var(--pv-primary,#0D9488);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden;}
.preview-strip .pv-logo img{width:100%;height:100%;object-fit:cover;}
.preview-strip .pv-name{font-weight:700;font-size:14.5px;}
.preview-strip .pv-btn{margin-left:auto;padding:9px 16px;border-radius:9px;background:var(--pv-accent,#F59E0B);color:#fff;font-weight:700;font-size:12.5px;}
.style-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.style-opt{border:1.5px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;text-align:center;background:var(--surface);}
.style-opt.sel{border-color:var(--primary);background:var(--primary-light);}
.style-opt .demo-shape{width:100%;height:28px;background:var(--text-mute);margin:0 auto 8px;opacity:.35;}
.style-opt .lbl{font-size:12px;font-weight:700;}

/* ---------- PIN Login ---------- */
.login-shell{max-width:380px;width:100%;text-align:center;}
.center-screen.lvl-bold{background:var(--primary);background-size:cover;background-position:center;}
.center-screen.lvl-bold .login-shell{color:#fff;}
.login-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:26px;}
.login-logo{width:60px;height:60px;border-radius:var(--radius-m);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:12px;overflow:hidden;}
.login-logo img{width:100%;height:100%;object-fit:cover;}
.lvl-subtle .login-logo{display:none;}
.lvl-bold .login-logo{width:80px;height:80px;font-size:26px;background:rgba(255,255,255,.22);}
.login-brand h1{font-size:19px;}
.login-brand .sub{color:var(--text-mute);font-size:12.5px;margin-top:2px;}
.lvl-bold .login-brand .sub{color:rgba(255,255,255,.75);}
.lvl-bold .pin-hint{background:rgba(255,255,255,.14);color:#fff;}
.lvl-bold .pin-key{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;}
.lvl-bold .pin-key:hover{background:rgba(255,255,255,.22);}
.lvl-bold .pin-key.wide{color:rgba(255,255,255,.85);}
.lvl-bold .tagline{color:rgba(255,255,255,.7);}
.lvl-bold .tagline b{color:#fff;}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:22px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:background .12s,border-color .12s;}
.pin-dot.filled{background:var(--primary);border-color:var(--primary);}
.pin-dot.err{border-color:var(--danger);}
.pin-error{color:var(--danger);font-size:13px;font-weight:600;height:18px;margin-bottom:4px;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:270px;margin:0 auto;}
.pin-key{aspect-ratio:1;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);font-size:19px;font-weight:700;font-family:var(--font-mono);cursor:pointer;transition:background .1s,transform .08s;}
.pin-key:hover{background:var(--surface-alt);}
.pin-key:active{transform:scale(.94);}
.pin-key.wide{grid-column:span 1;font-size:13px;font-weight:600;color:var(--text-soft);}
.pin-hint{margin-top:20px;font-size:12px;color:var(--text-mute);background:var(--surface-alt);padding:10px 14px;border-radius:10px;}
.pin-pad-sm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:200px;margin:14px auto 0;}
.pin-pad-sm button{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:15px;font-weight:700;font-family:var(--font-mono);cursor:pointer;}
.pin-pad-sm button:hover{background:var(--surface-alt);}
.pin-pad-sm button.wide{font-size:11px;color:var(--text-soft);}

/* ---------- Till layout ----------
   Design language: solid brand-colour product keys, bold uppercase labels, plain-worded
   function buttons instead of icon glyphs, and a clear itemised order ticket — closer to a
   traditional EPOS terminal than a soft consumer app. How far the header/customer-display lean
   into full brand colour is controlled by the owner's chosen branding depth per stage (see
   brandStage()) rather than being fixed. */
.till-wrap{display:flex;flex-direction:column;height:100vh;}
.till-header{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--surface);border-bottom:2px solid var(--border);flex-shrink:0;flex-wrap:wrap;transition:background .2s,border-color .2s;}
.till-header.lvl-bold{background:var(--primary);border-bottom-color:transparent;box-shadow:var(--shadow-s);}
.th-logo{width:38px;height:38px;border-radius:var(--radius-s);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;overflow:hidden;flex-shrink:0;}
.th-logo img{width:100%;height:100%;object-fit:cover;}
.till-header.lvl-bold .th-logo{background:rgba(255,255,255,.22);width:44px;height:44px;font-size:15px;}
.till-header.lvl-subtle .th-logo{display:none;}
.th-name{font-weight:800;font-size:15.5px;letter-spacing:-.01em;}
.th-meta{font-size:11px;color:var(--text-mute);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;}
.till-header.lvl-bold .th-name{color:#fff;}
.till-header.lvl-bold .th-meta{color:rgba(255,255,255,.75);}
.th-spacer{flex:1;}
.th-fn{display:flex;gap:8px;flex-wrap:wrap;}
.fn-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--radius-s);border:1.5px solid var(--border);background:var(--surface);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--text-soft);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s;}
.fn-btn:hover{background:var(--surface-alt);}
.fn-btn .ct{background:var(--danger);color:#fff;border-radius:100px;padding:1px 6px;font-size:10px;font-family:var(--font-mono);}
.till-header.lvl-bold .fn-btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.32);color:#fff;}
.till-header.lvl-bold .fn-btn:hover{background:rgba(255,255,255,.24);}
.till-header.lvl-bold .status-pill{background:rgba(255,255,255,.18);color:#fff;}
.till-header.lvl-bold .status-pill.off{background:rgba(255,255,255,.18);color:#fff;}
.till-header.lvl-bold .status-pill .dot{background:#fff;}
.th-staff{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;background:var(--surface-alt);border-radius:var(--radius-s);}
.th-staff-av{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.th-staff-name{font-size:12.5px;font-weight:700;}
.till-header.lvl-bold .th-staff{background:rgba(255,255,255,.16);}
.till-header.lvl-bold .th-staff-av{background:rgba(255,255,255,.32);}
.till-header.lvl-bold .th-staff-name{color:#fff;}
.till-main{flex:1;display:flex;overflow:hidden;}
.till-products{flex:1;display:flex;flex-direction:column;padding:18px 20px;overflow:hidden;position:relative;}
.till-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.05;z-index:0;overflow:hidden;}
.till-watermark img{width:55%;max-width:380px;object-fit:contain;}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;flex-shrink:0;position:relative;z-index:1;}
.cat-tab{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--radius-s);border:1.5px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;white-space:nowrap;transition:.15s;}
.cat-tab .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.cat-tab:hover{background:var(--surface-alt);}
.cat-tab.active{background:var(--text);border-color:var(--text);color:var(--surface);}
.cat-tab.active .dot{box-shadow:0 0 0 2px rgba(255,255,255,.4);}
.search-row{margin-bottom:14px;flex-shrink:0;display:flex;gap:8px;position:relative;z-index:1;}
.search-row input{flex:1;padding:11px 14px;border-radius:var(--radius-s);border:1.5px solid var(--border);font-size:14px;background:var(--surface);}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px;overflow-y:auto;padding-bottom:20px;align-content:start;position:relative;z-index:1;}
.product-btn{border:none;border-left:5px solid rgba(255,255,255,.4);border-radius:var(--radius-m);padding:14px 14px 12px;text-align:left;cursor:pointer;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:var(--shadow-s);transition:transform .08s ease,box-shadow .15s ease;position:relative;}
.product-btn:active{transform:scale(.96);}
.product-btn .nm{font-weight:800;font-size:13.5px;line-height:1.28;text-transform:uppercase;letter-spacing:.01em;}
.product-btn .dt{font-size:10.5px;opacity:.85;margin-top:3px;font-weight:600;text-transform:none;letter-spacing:0;}
.product-btn .pr{font-family:var(--font-mono);font-weight:800;font-size:14.5px;margin-top:8px;}
.pb-tags{display:flex;align-items:flex-start;margin-bottom:8px;}
.product-btn .stock-tag{margin-left:auto;font-size:9.5px;font-weight:800;background:rgba(0,0,0,.3);padding:2px 6px;border-radius:5px;font-family:var(--font-mono);}
.product-btn .stock-tag.low{background:var(--danger);}
.product-btn .age-tag{font-size:10px;background:rgba(0,0,0,.32);width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.empty-state{margin:auto;text-align:center;color:var(--text-mute);padding:40px;font-weight:600;font-size:13.5px;}
.layout-grid{display:grid;grid-template-columns:repeat(var(--layout-cols,6),1fr);grid-auto-rows:92px;gap:12px;overflow-y:auto;padding-bottom:20px;position:relative;z-index:1;}

/* ---------- Till layout editor (settings) ---------- */
.layout-editor-grid{display:grid;grid-template-columns:repeat(var(--layout-cols,6),1fr);grid-auto-rows:64px;gap:8px;max-height:600px;overflow-y:auto;}
.layout-cell-empty{border:1.5px dashed var(--border);border-radius:var(--radius-s);background:transparent;color:var(--text-mute);font-size:20px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.layout-cell-empty:hover{background:var(--surface-alt);border-color:var(--primary);color:var(--primary);}
.layout-cell-block{border:none;border-radius:var(--radius-s);color:#fff;cursor:pointer;padding:9px 10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-s);overflow:hidden;}
.layout-cell-block .lb-type{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.8;}
.layout-cell-block .lb-name{font-size:12px;font-weight:800;line-height:1.25;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.size-stepper-row{display:flex;gap:22px;}
.size-stepper{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-soft);}
.size-stepper .sv{min-width:16px;text-align:center;color:var(--text);font-family:var(--font-mono);font-weight:800;}

/* ---------- Cart / order ticket ---------- */
.cart-panel{width:380px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;}
.cart-head{padding:16px 20px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.cart-head h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;}
.cart-head-actions{display:flex;gap:6px;}
.cart-customer{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--surface-alt);font-size:12.5px;font-weight:600;}
.cart-customer .cav{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cart-customer .cn{font-weight:700;flex:1;}
.cart-customer .cp{color:var(--text-mute);font-family:var(--font-mono);font-size:11px;}
.cart-items{flex:1;overflow-y:auto;padding:10px 16px;}
.cart-empty{text-align:center;color:var(--text-mute);font-size:13px;padding:50px 20px;}
.cart-line{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px dashed var(--surface-alt);flex-wrap:wrap;}
.cart-line .sw{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.cart-line .info{flex:1;min-width:0;}
.cart-line .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cart-line .pr{font-size:11.5px;color:var(--text-mute);font-family:var(--font-mono);}
.cart-line .pr .was{text-decoration:line-through;opacity:.6;margin-right:4px;}
.qty-ctrl{display:flex;align-items:center;gap:6px;}
.qty-btn{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--surface-alt);cursor:pointer;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
.qty-val{font-family:var(--font-mono);font-weight:700;font-size:12.5px;min-width:16px;text-align:center;}
.line-total{font-family:var(--font-mono);font-weight:700;font-size:13px;min-width:52px;text-align:right;}
.rm-btn{color:var(--text-mute);background:none;border:none;cursor:pointer;font-size:14px;padding:2px;}
.disc-btn{color:var(--accent-dark);background:none;border:none;cursor:pointer;font-size:11px;font-weight:700;padding:2px;}
.line-disc-tag{font-size:10px;font-weight:800;color:var(--success);background:var(--success-light);padding:1px 6px;border-radius:100px;margin-left:22px;}
.cart-foot{padding:14px 20px 18px;border-top:1px solid var(--border);}
.tot-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-soft);margin-bottom:6px;}
.tot-row.disc{color:var(--success);}
.tot-row.grand{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--text);background:var(--surface-alt);border-radius:var(--radius-s);padding:12px 14px;margin:10px 0 14px;}
.tot-row.grand span:last-child{font-family:var(--font-mono);font-size:19px;}
.cart-foot-actions{display:flex;gap:8px;}
.cart-foot-row2{display:flex;gap:8px;margin-bottom:8px;}
.cart-foot-row2 .btn{flex:1;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,18,24,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border-radius:var(--radius-l);max-width:440px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-l);}
.modal-lg{max-width:640px;}
.modal-xl{max-width:820px;}
.modal-head{padding:22px 26px 4px;display:flex;align-items:start;justify-content:space-between;}
.modal-head h2{font-size:18px;}
.modal-head .close{cursor:pointer;color:var(--text-mute);background:none;border:none;font-size:18px;padding:4px;}
.modal-body{padding:18px 26px 26px;}

/* ---------- Checkout ---------- */
.pay-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--surface-alt);padding:5px;border-radius:12px;flex-wrap:wrap;}
.pay-tab{flex:1;padding:10px;border-radius:9px;border:none;background:none;font-weight:700;font-size:13px;cursor:pointer;color:var(--text-soft);min-width:70px;}
.pay-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-s);}
.due-box{text-align:center;padding:18px;background:var(--primary-light);border-radius:14px;margin-bottom:18px;}
.due-box .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--primary-dark);}
.due-box .amt{font-family:var(--font-mono);font-weight:800;font-size:32px;color:var(--primary-dark);margin-top:2px;}
.due-box .sub{font-size:11.5px;color:var(--primary-dark);opacity:.75;margin-top:4px;}
.loyalty-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-alt);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:12.5px;}
.quick-cash{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.quick-cash button{padding:12px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font-mono);}
.quick-cash button:hover{background:var(--surface-alt);}
.change-box{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:12px;background:var(--success-light);margin:14px 0;}
.change-box.neg{background:var(--danger-light);}
.change-box .lbl{font-size:12.5px;font-weight:700;color:var(--text-soft);}
.change-box .amt{font-family:var(--font-mono);font-weight:800;font-size:19px;color:var(--success);}
.change-box.neg .amt{color:var(--danger);}
.split-row{display:flex;gap:12px;margin-bottom:8px;}
.card-sim{text-align:center;padding:30px 10px;}
.card-sim .cico{display:inline-block;font-family:var(--font-mono);font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--text-soft);border:1.5px solid var(--border);border-radius:var(--radius-s);padding:10px 22px;margin-bottom:14px;}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:10px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.way-mode-row{display:flex;gap:8px;margin-bottom:14px;}
.way-mode-row .chip{flex:1;text-align:center;}
.way-count-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;justify-content:center;}
.way-count-row button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer;}
.way-count-row .n{font-family:var(--font-mono);font-weight:800;font-size:20px;min-width:26px;text-align:center;}
.assign-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--surface-alt);font-size:12.5px;}
.assign-row .nm{flex:1;font-weight:600;}
.guest-pick{display:flex;gap:4px;}
.guest-pick button{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);font-size:11px;font-weight:800;cursor:pointer;}
.guest-pick button.sel{background:var(--primary);border-color:var(--primary);color:#fff;}
.share-card{border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.share-card.paid{background:var(--success-light);border-color:var(--success);}
.share-card .sn{font-weight:700;font-size:13.5px;flex:1;}
.share-card .sa{font-family:var(--font-mono);font-weight:800;font-size:15px;}
.share-card .sbtns{display:flex;gap:6px;}
.share-card .sbtns button{padding:7px 10px;font-size:11.5px;}

/* ---------- Receipt ---------- */
.receipt{background:var(--surface);width:100%;max-width:320px;margin:0 auto;padding:26px 22px 20px;font-family:var(--font-mono);position:relative;}
.receipt-head{text-align:center;margin-bottom:16px;}
.receipt-logo{width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 8px;overflow:hidden;}
.receipt-logo img{width:100%;height:100%;object-fit:cover;}
.receipt-head .bn{font-weight:700;font-size:14px;font-family:var(--font-ui);}
.receipt-head .meta{font-size:10.5px;color:var(--text-mute);margin-top:4px;}
.receipt-div{border-top:1px dashed var(--border);margin:12px 0;}
.receipt-line{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;}
.receipt-line .nm{color:var(--text);}
.receipt-line .qy{color:var(--text-mute);}
.receipt-tot{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:var(--text-soft);}
.receipt-tot.grand{font-size:16px;font-weight:700;color:var(--text);margin-top:6px;}
.receipt-foot{text-align:center;font-size:10.5px;color:var(--text-mute);margin-top:16px;line-height:1.6;}
.perf{height:14px;position:relative;overflow:hidden;}
.perf::before{content:'';position:absolute;top:-7px;left:0;right:0;height:14px;background-image:radial-gradient(circle 7px, var(--bg) 7px, transparent 7.5px);background-size:20px 14px;background-repeat:repeat-x;}
.receipt-choice-row{display:flex;gap:8px;margin-top:16px;}
.receipt-choice-row .btn{flex:1;}

/* ---------- Control panel ---------- */
.cp-wrap{display:flex;height:100vh;}
.cp-sidebar{width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto;}
.cp-brand{display:flex;align-items:center;gap:10px;padding:6px 10px 20px;}
.cp-brand .lg{width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;overflow:hidden;}
.cp-brand .lg img{width:100%;height:100%;object-fit:cover;}
.cp-brand .nm{font-weight:800;font-size:13.5px;}
.cp-nav{display:flex;flex-direction:column;gap:3px;}
.cp-nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:10px;border:none;background:none;font-weight:600;font-size:13.5px;color:var(--text-soft);cursor:pointer;}
.cp-nav button:hover{background:var(--surface-alt);}
.cp-nav button.active{background:var(--primary-light);color:var(--primary-dark);}
.cp-sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.cp-main{flex:1;overflow-y:auto;padding:30px 40px 60px;}
.cp-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
.cp-topbar h1{font-size:22px;}
.cp-topbar .sub{color:var(--text-soft);font-size:13.5px;margin-top:3px;}
.section-card{padding:24px;margin-bottom:20px;}
.section-card h3{font-size:15px;margin-bottom:4px;}
.section-card .sc-sub{color:var(--text-soft);font-size:12.5px;margin-bottom:18px;}
.cat-block{margin-bottom:22px;}
.cat-block-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.cat-block-head .swd{width:10px;height:10px;border-radius:3px;}
.cat-block-head h4{font-size:13.5px;flex:1;}
.prod-list{display:flex;flex-direction:column;gap:8px;}
.prod-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);flex-wrap:wrap;}
.prod-row .swatch{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;flex-shrink:0;}
.prod-row .pinfo{flex:1;min-width:120px;}
.prod-row .pn{font-weight:700;font-size:13.5px;}
.prod-row .pd{font-size:11.5px;color:var(--text-mute);}
.prod-row .pp{font-family:var(--font-mono);font-weight:700;font-size:13.5px;color:var(--text-soft);width:64px;text-align:right;}
.prod-actions{display:flex;gap:6px;}
.edit-form{padding:14px;border:1.5px dashed var(--border);border-radius:12px;background:var(--surface-alt);margin-bottom:10px;}
.swatch-picker{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px;}
.swatch-opt{width:26px;height:26px;border-radius:7px;cursor:pointer;border:2px solid transparent;}
.swatch-opt.sel{border-color:var(--text);}
table.data-table{width:100%;border-collapse:collapse;}
table.data-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-mute);padding:0 12px 10px;font-weight:700;}
table.data-table td{padding:12px;border-top:1px solid var(--surface-alt);font-size:13.5px;}
table.data-table tr:hover td{background:var(--surface-alt);}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{padding:18px 20px;}
.stat-card .lbl{font-size:11.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.stat-card .val{font-family:var(--font-mono);font-weight:800;font-size:24px;margin-top:6px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar-row .bn{width:100px;font-size:12.5px;font-weight:600;flex-shrink:0;}
.bar-track{flex:1;height:9px;background:var(--surface-alt);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;background:var(--primary);border-radius:5px;}
.bar-row .bv{width:64px;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--text-soft);flex-shrink:0;}
.txn-row{cursor:pointer;}
.txn-detail{background:var(--surface-alt);padding:14px 16px;border-radius:10px;margin:-4px 0 10px;font-size:12.5px;}
.insight-list{display:flex;flex-direction:column;gap:10px;}
.insight-item{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface-alt);font-size:13px;}
.charter-list{display:flex;flex-direction:column;gap:0;}
.charter-item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--surface-alt);}
.charter-item:first-child{border-top:none;}
.charter-item .num{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.charter-item .txt{font-size:13.5px;line-height:1.5;padding-top:2px;}
.proc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px;}
.proc-opt{border:1.5px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;background:var(--surface);}
.proc-opt.sel{border-color:var(--primary);background:var(--primary-light);}
.proc-opt .pn{font-weight:700;font-size:13px;}
.proc-opt .pr{font-size:11px;color:var(--text-mute);font-family:var(--font-mono);margin-top:4px;}
.customer-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;}
.customer-row:hover{background:var(--surface-alt);}
.customer-row .cav{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.customer-row .cinfo{flex:1;min-width:0;}
.customer-row .cn{font-weight:700;font-size:13.5px;}
.customer-row .cm{font-size:11.5px;color:var(--text-mute);}
.customer-row .cpts{font-family:var(--font-mono);font-size:12px;color:var(--accent-dark);font-weight:700;}

/* ---------- misc ---------- */
.divider{height:1px;background:var(--border);margin:22px 0;}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.upload-row{display:flex;align-items:center;gap:12px;}
.file-btn{position:relative;overflow:hidden;}
.file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;z-index:400;box-shadow:var(--shadow-m);pointer-events:none;max-width:88vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.display-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;background:var(--bg);transition:background .2s,color .2s;}
.display-screen.lvl-bold{background:var(--primary);color:#fff;}
.display-screen .dlogo{width:88px;height:88px;border-radius:var(--radius-l);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;margin-bottom:18px;overflow:hidden;}
.display-screen .dlogo img{width:100%;height:100%;object-fit:cover;}
.display-screen.lvl-subtle .dlogo{display:none;}
.display-screen.lvl-bold .dlogo{width:108px;height:108px;font-size:36px;background:rgba(255,255,255,.22);}
.display-screen h1{font-size:26px;margin-bottom:30px;}
.display-screen .dlines{width:100%;max-width:480px;margin-bottom:20px;}
.display-screen .dline{display:flex;justify-content:space-between;font-size:16px;padding:10px 0;border-bottom:1px solid var(--border);}
.display-screen.lvl-bold .dline{border-bottom-color:rgba(255,255,255,.25);}
.display-screen .dtotal{font-size:44px;font-weight:800;font-family:var(--font-mono);margin-top:10px;}
.display-screen .dsub{color:var(--text-soft);margin-top:8px;font-size:14px;}
.display-screen.lvl-bold .dsub{color:rgba(255,255,255,.8);}
@media (max-width:860px){
  .till-main{flex-direction:column;}
  .cart-panel{width:100%;border-left:none;border-top:1px solid var(--border);max-height:46vh;}
  .cp-wrap{flex-direction:column;height:auto;min-height:100vh;}
  .cp-sidebar{width:100%;flex-direction:row;overflow-x:auto;align-items:center;}
  .cp-nav{flex-direction:row;}

/* ============================ HELPERS ============================ */
function esc(str){ return String(str??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){ return state.business.currency + (Math.round((n+Number.EPSILON)*100)/100).toFixed(2); }
function getInitials(name){ if(!name) return '?'; const p = name.trim().split(/\s+/); return (p[0]?.[0]||'').toUpperCase() + (p[1]?.[0]||'').toUpperCase(); }

/* ---------- Till layout helpers ---------- */
function defaultBlocksForCategory(products, cat){
  const prods = products.filter(p=>p.categoryId===cat.id);
  return prods.map((p,i)=>({
    id: uid(), type:'product', productId:p.id,
    x: i % LAYOUT_COLS, y: Math.floor(i / LAYOUT_COLS), w:1, h:1,
    color: p.color || '#0D9488', label: p.name
  }));
}
function categoryBlocks(cat){
  if(!cat) return [];
  if(!cat.blocks) cat.blocks = defaultBlocksForCategory(state.products, cat);
  cat.blocks = cat.blocks.filter(b=>{
    if(b.type==='product') return state.products.some(p=>p.id===b.productId);
    if(b.type==='category') return state.categories.some(c=>c.id===b.categoryId);
    return true;
  });
  return cat.blocks;
}
function blockCells(b){
  const cells = [];
  for(let dy=0; dy<b.h; dy++) for(let dx=0; dx<b.w; dx++) cells.push({x:b.x+dx, y:b.y+dy});
  return cells;
}
function isAreaFree(cat, x, y, w, h, excludeId){
  if(x<0 || y<0 || w<1 || h<1 || x+w>LAYOUT_COLS) return false;
  return categoryBlocks(cat).every(b=>{
    if(b.id===excludeId) return true;
    return !(x < b.x+b.w && x+w > b.x && y < b.y+b.h && y+h > b.y);
  });
}
function nextFreeCell(cat, w, h){
  const blocks = categoryBlocks(cat);
  const maxY = blocks.reduce((m,b)=>Math.max(m,b.y+b.h), 0);
  for(let y=0; y<=maxY+10; y++){
    for(let x=0; x<=LAYOUT_COLS-w; x++){
      if(isAreaFree(cat, x, y, w, h, null)) return {x,y};
    }
  }
  return {x:0, y:maxY};
}
function layoutRowCount(cat){
  const maxY = categoryBlocks(cat).reduce((m,b)=>Math.max(m,b.y+b.h), 0);
  return Math.max(4, maxY+2);
}
function blockTypeMeta(type){ return BLOCK_TYPES.find(t=>t.id===type) || {label:type, desc:''}; }
function blockDisplay(b){
  if(b.type==='product'){
    const p = state.products.find(x=>x.id===b.productId); if(!p) return null;
    return {label: b.label || p.name, sub: fmtMoney(p.price), color: b.color};
  }
  if(b.type==='category'){
    const c = state.categories.find(x=>x.id===b.categoryId); if(!c) return null;
    return {label: b.label || c.name, sub:'Go to category', color: b.color};
  }
  return {label: b.label || blockTypeMeta(b.type).label, sub: (b.type==='cash'||b.type==='card') ? 'Quick pay' : 'Action', color: b.color};
}
function shade(hex, pct){
  hex = hex.replace('#','');
  let r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  r = Math.min(255,Math.max(0, Math.round(r + (pct<0? r*pct/100 : (255-r)*pct/100))));
  g = Math.min(255,Math.max(0, Math.round(g + (pct<0? g*pct/100 : (255-g)*pct/100))));
  b = Math.min(255,Math.max(0, Math.round(b + (pct<0? b*pct/100 : (255-b)*pct/100))));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function hexToRgba(hex, a){ hex = hex.replace('#',''); const r=parseInt(hex.substring(0,2),16),g=parseInt(hex.substring(2,4),16),b=parseInt(hex.substring(4,6),16); return `rgba(${r},${g},${b},${a})`; }

  else document.documentElement.removeAttribute('data-theme');
}

/* ---------- Cart / totals maths (line discounts + order discount) ---------- */
function lineGross(item){
  let g = item.price * item.qty;
  if(item.lineDiscount && item.lineDiscount.type==='percent') g -= g * item.lineDiscount.value/100;
  else if(item.lineDiscount && item.lineDiscount.type==='amount') g -= Math.min(g, item.lineDiscount.value);
  return Math.max(0, g);
}
function cartTotals(){
  const preDiscountGross = state.cart.reduce((sum,i)=> sum + lineGross(i), 0);
  const od = state.orderDiscount || {type:'none',value:0};
  let discountAmt = 0;
  if(od.type==='percent') discountAmt = preDiscountGross * od.value/100;
  else if(od.type==='amount') discountAmt = Math.min(preDiscountGross, od.value);
  const subtotalGross = Math.max(0, preDiscountGross - discountAmt);
  let exVat, vat, total;
  if(state.business.taxInclusive){
    total = subtotalGross;
    vat = total - total/(1+state.business.taxRate/100);
    exVat = total - vat;
  } else {
    exVat = subtotalGross;
    vat = exVat * state.business.taxRate/100;
    total = exVat + vat;
  }
  return { exVat, vat, total, discountAmt, preDiscountGross };
}
function activeCustomer(){ return state.customers.find(c=>c.id===state.activeCustomerId) || null; }
function loyaltyRedemptionValue(){
  const c = activeCustomer(); if(!c || !state.business.loyaltyEnabled) return 0;
  return Math.round(c.loyaltyPoints * state.business.pointValuePence)/100;
}
function dueAfterRedemption(totals){
  const redeem = state.checkout.redeemPoints ? loyaltyRedemptionValue() : 0;
  return Math.max(0, Math.round((totals.total - Math.min(totals.total, redeem)) * 100)/100);
}

/* ---------- Persistence (offline-first: local storage is the source of truth) ---------- */
let saveTimer = null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 300); }
function saveState(){
  try{
    const {screen, wizardStep, typeSearch, ...persisted} = state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(persisted));
  }catch(e){ /* storage unavailable — app still works for this session */ }
}
function reviveDatesDeep(obj, keys){
  keys.forEach(k=>{
    if(obj && obj[k]) obj[k] = new Date(obj[k]);
  });
}
function loadState(){
  let raw;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
  if(!raw) return null;
  try{
    const loaded = JSON.parse(raw);
    const fresh = seedState();
    const merged = Object.assign(fresh, loaded);
    merged.business = Object.assign({}, fresh.business, loaded.business||{});
    merged.checkout = fresh.checkout; // never resume a mid-payment UI state
    merged.receipt = null;
    merged.override = fresh.override; merged.ageGate = fresh.ageGate;
    merged.refund = fresh.refund; merged.ticketsModal = false;
    merged.customerPicker = fresh.customerPicker;
    merged.cp = fresh.cp;
    (merged.sales||[]).forEach(s=>{ s.time = new Date(s.time); (s.refunds||[]).forEach(r=>r.time=new Date(r.time)); });
    (merged.cashUps||[]).forEach(c=>c.time = new Date(c.time));
    (merged.ageChecks||[]).forEach(a=>a.time = new Date(a.time));
    (merged.voids||[]).forEach(v=>v.time = new Date(v.time));
    (merged.noSales||[]).forEach(n=>n.time = new Date(n.time));
    (merged.parkedTickets||[]).forEach(t=>t.createdAt = new Date(t.createdAt));
    merged.screen = merged.currentStaff ? 'till' : (merged.business.setupComplete ? 'login' : 'welcome');
    return merged;
  }catch(e){ return null; }
}
function exportAllDataJson(){
  const {screen, wizardStep, typeSearch, checkout, override, ageGate, refund, ticketsModal, customerPicker, cp, ...data} = state;
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  downloadBlob(blob, sanitizeName(state.business.name)+'-full-export-'+dateStamp()+'.json');
  toast('Full data export downloaded — it\'s yours, in an open format, any time.');
}
function importAllDataJson(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('Import this data and replace everything currently on this till? This cannot be undone.')) return;
      const fresh = seedState();
      state = Object.assign(fresh, data);
      state.business = Object.assign({}, fresh.business, data.business||{});
      (state.sales||[]).forEach(s=>{ s.time = new Date(s.time); (s.refunds||[]).forEach(r=>r.time=new Date(r.time)); });
      (state.cashUps||[]).forEach(c=>c.time = new Date(c.time));
      (state.ageChecks||[]).forEach(a=>a.time = new Date(a.time));
      (state.voids||[]).forEach(v=>v.time = new Date(v.time));
      (state.noSales||[]).forEach(n=>n.time = new Date(n.time));
      (state.parkedTickets||[]).forEach(t=>t.createdAt = new Date(t.createdAt));
      state.screen = state.currentStaff ? 'till' : 'login';
      applyTheme(); saveState(); render();
      toast('Data imported successfully.');
    }catch(err){ alert('That file could not be read as a valid export.'); }
  };
  reader.readAsText(file);
}
function wipeAllData(){
  if(!confirm('Wipe ALL local data (products, sales, staff, customers, settings)? This cannot be undone.')) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  state = seedState();

}

function render(){
  const root = document.getElementById('app');
  let html = '';
  switch(state.screen){
    case 'welcome': html = renderWelcome(); break;
    case 'wizard': html = renderWizard(); break;
    case 'login': html = renderLogin(); break;
    case 'till': html = renderTill(); break;
    case 'controlpanel': html = renderControlPanel(); break;
    case 'display': html = renderCustomerDisplay(); break;
  }
  root.innerHTML = html
    + (state.checkout.open ? renderCheckoutModal() : '')
    + (state.receipt ? renderReceiptModal() : '')
    + (state.override.open ? renderOverrideModal() : '')
    + (state.ageGate.open ? renderAgeGateModal() : '')
    + (state.ticketsModal ? renderTicketsModal() : '')
    + (state.discountModal.open ? renderDiscountModal() : '')
    + (state.customerPicker.open ? renderCustomerPickerModal() : '')
    + (state.refund.open ? renderRefundModal() : '')
    + (state.cp.blockEditor && state.cp.blockEditor.open ? renderLayoutBlockModal() : '');
  if(state.screen === 'login'){ updatePinDots(); }
  if(state.screen !== 'display') scheduleSave();
}

/* ============================ TICKETS (park / recall — also "tabs") ============================ */
function ticketDefaultName(){
  const n = state.parkedTickets.length + 1;
  return ticketLabel() + ' ' + n;
}
function parkCurrentSale(){
  if(!state.cart.length){ toast('Nothing to park — the sale is empty.'); return; }
  const name = prompt(`Name this ${ticketLabel().toLowerCase()}:`, ticketDefaultName());
  if(name===null) return;
  state.parkedTickets.push({
    id: uid(), name: name.trim() || ticketDefaultName(),
    cart: state.cart, orderDiscount: state.orderDiscount, customerId: state.activeCustomerId,
    createdAt: new Date()
  });
  state.cart = []; state.orderDiscount = {type:'none',value:0,reason:''}; state.activeCustomerId = null;
  render();
  toast(`${ticketLabel()} parked — recall it any time from “Open ${ticketLabel(true).toLowerCase()}”.`);
}
function openTicketsModal(){ state.ticketsModal = true; render(); }
function closeTicketsModal(){ state.ticketsModal = false; render(); }
function recallTicket(id){
  if(state.cart.length && !confirm('Recalling will replace the current sale on screen — continue?')) return;
  const t = state.parkedTickets.find(x=>x.id===id); if(!t) return;
  state.cart = t.cart; state.orderDiscount = t.orderDiscount || {type:'none',value:0,reason:''}; state.activeCustomerId = t.customerId||null;
  state.parkedTickets = state.parkedTickets.filter(x=>x.id!==id);
  state.ticketsModal = false;
  render();
}
function deleteTicket(id){
  if(!confirm(`Delete this ${ticketLabel().toLowerCase()}? Its items will be lost.`)) return;
  state.parkedTickets = state.parkedTickets.filter(x=>x.id!==id);
  render();
}

  return `

            <div class="pinfo"><div class="pn">${esc(t.name)}</div><div class="pd">${t.cart.length} item${t.cart.length===1?'':'s'} · opened ${t.createdAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div></div>

function renderLiveLayoutGrid(cat, isAdmin){
  const b = state.business;
  if(!cat){
    return `<div class="empty-state">No categories yet.${isAdmin?' Add one from Control panel → '+esc(typeLabel())+'.':''}</div>`;
  }
  const blocks = categoryBlocks(cat);
  if(!blocks.length){
    return `<div class="empty-state">This category has no buttons yet.${isAdmin?' Add some from Control panel → Till layout.':''}</div>`;
  }
  return `<div class="layout-grid" style="--layout-cols:${LAYOUT_COLS};">
    ${blocks.map(bl=>{
      if(bl.type==='product'){
        const p = state.products.find(x=>x.id===bl.productId); if(!p) return '';
        const low = p.trackStock && p.stock<=p.lowStockThreshold;
        const out = p.trackStock && p.stock<=0;
        const ageTag = p.ageRestricted && b.ageRestrictionEnabled ? `<div class="age-tag">18</div>` : '';
        const stockTag = p.trackStock ? `<div class="stock-tag ${low?'low':''}">${out?'OUT':p.stock+' left'}</div>` : '';
        return `
        <button class="product-btn" style="grid-column:${bl.x+1}/span ${bl.w};grid-row:${bl.y+1}/span ${bl.h};background:${bl.color};${out?'opacity:.5;':''}" onclick="fireBlockAction('${cat.id}','${bl.id}')">
          ${ageTag||stockTag ? `<div class="pb-tags">${ageTag}${stockTag}</div>` : ''}
          <div><div class="nm">${esc(bl.label||p.name)}</div></div>
          <div class="pr">${fmtMoney(p.price)}</div>
        </button>`;
      }
      const d = blockDisplay(bl); if(!d) return '';
      return `
      <button class="product-btn" style="grid-column:${bl.x+1}/span ${bl.w};grid-row:${bl.y+1}/span ${bl.h};background:${d.color};" onclick="fireBlockAction('${cat.id}','${bl.id}')">
        <div><div class="nm">${esc(d.label)}</div></div>
        <div class="dt" style="text-transform:none;">${esc(d.sub)}</div>
      </button>`;
    }).join('')}
  </div>`;
}
function fireBlockAction(catId, blockId){
  const cat = state.categories.find(c=>c.id===catId); if(!cat) return;
  const block = categoryBlocks(cat).find(b=>b.id===blockId); if(!block) return;
  switch(block.type){
    case 'product': addToCart(block.productId); break;
    case 'category': selectCategory(block.categoryId); break;
    case 'cash': quickPay('cash'); break;
    case 'card': quickPay('card'); break;
    case 'discount':
      if(!state.cart.length){ toast('Add items to the sale first.'); return; }
      openOrderDiscount();
      break;
    case 'void':
      if(!state.cart.length){ toast('Nothing to void — the sale is empty.'); return; }
      voidSaleFlow();
      break;
    case 'park': parkCurrentSale(); break;
    case 'nosale': noSaleFlow(); break;
    case 'customer': openCustomerPicker(); break;
    case 'search': document.querySelector('.search-row input')?.focus(); break;
  }
}
function quickPay(method){
  if(!state.cart.length){ toast('Add items to the sale first.'); return; }
  openCheckout();
  if(method==='card') setPayTab('card');
}
function onTillSearch(v){ state.search = v; render(); document.querySelector('.search-row input')?.focus(); }
function selectCategory(id){ state.activeCategory = id; state.search=''; render(); }
function addToCart(productId){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  if(p.trackStock && p.stock<=0){ toast(p.name+' is out of stock.'); return; }
  if(state.business.ageRestrictionEnabled && p.ageRestricted){ state.ageGate = {open:true, productId}; render(); return; }
  reallyAddToCart(p);
}
function reallyAddToCart(p){
  const existing = state.cart.find(i=>i.productId===p.id);
  if(existing) existing.qty++;
  else state.cart.push({productId:p.id, name:p.name, price:p.price, color:p.color||state.business.primaryColor, qty:1, lineDiscount:{type:'none',value:0}});
  render();
}
function changeQty(productId, delta){
  const item = state.cart.find(i=>i.productId===productId); if(!item) return;
  item.qty += delta;
  if(item.qty<=0) state.cart = state.cart.filter(i=>i.productId!==productId);
  render();
}
function removeFromCart(productId){ state.cart = state.cart.filter(i=>i.productId!==productId); render(); }
function clearCart(){ state.cart=[]; state.orderDiscount={type:'none',value:0,reason:''}; state.activeCustomerId=null; render(); }

/* ---------- Discounts ---------- */
function openOrderDiscount(){ state.discountModal = {open:true, scope:'order', productId:null, type:'percent', value:10, reason:''}; render(); }
function openLineDiscount(productId){ state.discountModal = {open:true, scope:'line', productId, type:'percent', value:10, reason:''}; render(); }
function closeDiscountModal(){ state.discountModal.open=false; render(); }
function setDiscountType(t){ state.discountModal.type=t; render(); }
function setDiscountValue(v){ state.discountModal.value = Math.max(0, parseFloat(v)||0); }
function setDiscountReason(v){ state.discountModal.reason = v; }
function applyDiscount(){
  const d = state.discountModal;
  const valEl = document.getElementById('disc-value'); const value = valEl ? Math.max(0, parseFloat(valEl.value)||0) : d.value;
  const reasonEl = document.getElementById('disc-reason'); const reason = reasonEl ? reasonEl.value.trim() : '';
  const needsApproval = (d.type==='percent' && value>20) || (d.type==='amount' && value>10);
  const doApply = () => {
    if(d.scope==='order'){ state.orderDiscount = {type:d.type, value, reason}; }
    else {
      const item = state.cart.find(i=>i.productId===d.productId);
      if(item) item.lineDiscount = {type:d.type, value};
    }
    state.discountModal.open = false;
    render();
    toast('Discount applied.');
  };
  if(needsApproval) requireManagerPin('Approve a discount above the standard threshold', doApply);
  else doApply();
}
function renderDiscountModal(){
  const d = state.discountModal;
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeDiscountModal()">
    <div class="modal" style="max-width:400px;">
      <div class="modal-head"><h2>${d.scope==='order'?'Discount whole sale':'Discount this item'}</h2><button class="close" onclick="closeDiscountModal()">✕</button></div>
      <div class="modal-body">
        <div class="pay-tabs">
          <button class="pay-tab ${d.type==='percent'?'active':''}" onclick="setDiscountType('percent')">Percentage</button>
          <button class="pay-tab ${d.type==='amount'?'active':''}" onclick="setDiscountType('amount')">Amount off</button>
        </div>
        <div class="chip-row" style="margin-bottom:14px;">
          ${(d.type==='percent'?[5,10,20,25]:[1,2,5,10]).map(v=>`<button class="chip" onclick="quickSetDiscount(${v})">${d.type==='percent'?v+'%':fmtMoney(v)}</button>`).join('')}
        </div>
        <div class="field">

          <input type="number" id="disc-value" min="0" step="${d.type==='percent'?1:0.01}" value="${d.value}">
        </div>
        <div class="field">

          <input type="text" id="disc-reason" placeholder="e.g. Loyal customer, damaged packaging…" value="${esc(d.reason)}">
        </div>

        <button class="btn btn-primary btn-lg btn-block" onclick="applyDiscount()">Apply discount</button>
      </div>
    </div>

}
function quickSetDiscount(v){ document.getElementById('disc-value').value = v; state.discountModal.value = v; }

/* ---------- Void sale / No sale (audited, manager-approved) ---------- */
function voidSaleFlow(){
  if(!state.cart.length) return;
  const reason = prompt('Reason for voiding this sale (e.g. Mis-ring, Customer left, Till error):', 'Mis-ring');
  if(reason===null) return;
  const totals = cartTotals();
  requireManagerPin('Approve void of '+fmtMoney(totals.total), ()=>{
    state.voids.push({id:uid(), time:new Date(), staffName:state.currentStaff?.name||'', total:totals.total, itemCount:state.cart.reduce((a,i)=>a+i.qty,0), reason: reason.trim()||'Not given'});
    state.cart = []; state.orderDiscount={type:'none',value:0,reason:''}; state.activeCustomerId=null;
    render();
    toast('Sale voided and logged for audit.');
  });
}
function noSaleFlow(){
  requireManagerPin('Approve no-sale (open drawer without a transaction)', ()=>{
    state.noSales.push({id:uid(), time:new Date(), staffName:state.currentStaff?.name||''});
    render();
    toast('Drawer opened (simulated) — logged for audit.');
  });
}

/* ============================ CHECKOUT ============================ */
function openCheckout(){
  const totals = cartTotals();
  state.checkout = { open:true, tab:'cash', tendered: Math.ceil(totals.total), splitCash:0, redeemPoints:false,
    receiptChoice:'print', emailInput:'', wayMode:'even', wayCount:2, wayAssign:{}, wayShares:null, activeShare:0, processing:false };
  render();
}
function closeCheckout(){ state.checkout.open=false; render(); }
function setPayTab(tab){
  state.checkout.tab=tab; state.checkout.processing=false;
  if(tab==='ways') buildWayShares();
  render();
}
function toggleRedeemPoints(){
  state.checkout.redeemPoints = !state.checkout.redeemPoints;
  const totals = cartTotals();
  state.checkout.tendered = Math.ceil(dueAfterRedemption(totals));
  render();
}
function setTendered(v){ state.checkout.tendered = Math.max(0, v); render(); }
function onTenderedInput(el){
  state.checkout.tendered = parseFloat(el.value)||0;
  patchChangeDisplay();
}
function patchChangeDisplay(){
  const totals = cartTotals();
  const due = dueAfterRedemption(totals);
  const diff = state.checkout.tendered - due;
  const box = document.getElementById('change-box');
  if(!box) return;
  box.classList.toggle('neg', diff<0);
  box.querySelector('.lbl').textContent = diff<0 ? 'Still due' : 'Change due';
  box.querySelector('.amt').textContent = fmtMoney(Math.abs(diff));
  document.getElementById('confirm-cash-btn').disabled = diff < 0;
}
function onSplitCashInput(el){
  state.checkout.splitCash = parseFloat(el.value)||0;
  const totals = cartTotals();
  const due = dueAfterRedemption(totals);
  const card = Math.max(0, due - state.checkout.splitCash);
  document.getElementById('split-card-amt').textContent = fmtMoney(card);
  document.getElementById('confirm-split-btn').disabled = state.checkout.splitCash < 0 || state.checkout.splitCash > due;
}

/* ---------- Split ways (evenly or by item) ---------- */
function setWayMode(m){ state.checkout.wayMode = m; buildWayShares(); render(); }
function changeWayCount(delta){
  state.checkout.wayCount = Math.min(8, Math.max(2, state.checkout.wayCount+delta));
  buildWayShares(); render();
}
function assignLineToGuest(idx, guest){ state.checkout.wayAssign[idx] = guest; buildWayShares(); render(); }
function buildWayShares(){
  const totals = cartTotals();
  const due = dueAfterRedemption(totals);
  const n = state.checkout.wayCount;
  let shares;
  if(state.checkout.wayMode==='even'){
    const base = Math.floor((due*100)/n)/100;
    shares = Array.from({length:n}, (_,i)=> i===n-1 ? Math.round((due - base*(n-1))*100)/100 : base);
  } else {
    const totalsPerGuest = Array(n).fill(0);
    state.cart.forEach((item, idx)=>{
      const guest = state.checkout.wayAssign[idx] ?? 0;
      totalsPerGuest[guest] = (totalsPerGuest[guest]||0) + lineGross(item);
    });
    const rawSum = totalsPerGuest.reduce((a,b)=>a+b,0) || 1;
    shares = totalsPerGuest.map(v => Math.round((v/rawSum)*due*100)/100);
  }
  state.checkout.wayShares = shares.map((amt,i)=>({ guest:i+1, amount:amt, paid:false, method:null }));
}
function paySlice(i, method){
  const s = state.checkout.wayShares[i]; if(!s || s.paid) return;
  s.paid = true; s.method = method;
  render();
  if(state.checkout.wayShares.every(x=>x.paid)) setTimeout(()=>completeSale('split-ways'), 350);
}

function simulateCardPayment(){
  state.checkout.processing = true; render();
  setTimeout(()=> completeSale('card'), 900);
}
function completeSale(method){
  const totals = cartTotals();
  const co = state.checkout;
  const due = dueAfterRedemption(totals);
  const redemptionValue = co.redeemPoints ? Math.min(totals.total, loyaltyRedemptionValue()) : 0;
  let tendered=null, change=null, splitCash=null, splitCard=null, cashNet=0, wayShares=null;
  if(method==='cash'){ tendered=co.tendered; change=co.tendered-due; cashNet = due; }
  if(method==='card'){ cashNet = 0; }
  if(method==='split'){ splitCash=co.splitCash; splitCard=Math.max(0,due-co.splitCash); cashNet = splitCash; }
  if(method==='split-ways'){
    wayShares = co.wayShares;
    cashNet = wayShares.filter(s=>s.method==='cash').reduce((a,s)=>a+s.amount,0);
  }
  const cust = activeCustomer();
  let pointsEarned = 0;
  if(cust && state.business.loyaltyEnabled && !co.redeemPoints){
    pointsEarned = Math.floor(due * (state.business.pointsPerPound||0));
    cust.loyaltyPoints += pointsEarned;
  } else if(cust && co.redeemPoints){
    const spent = Math.round(redemptionValue / (state.business.pointValuePence/100 || 1));
    cust.loyaltyPoints = Math.max(0, cust.loyaltyPoints - spent);
  }
  if(cust){ cust.visits = (cust.visits||0)+1; cust.totalSpend = Math.round(((cust.totalSpend||0)+due)*100)/100; }
  const preDiscountGross = totals.preDiscountGross || 1;
  const discountRatio = preDiscountGross>0 ? (1 - totals.discountAmt/preDiscountGross) : 1;
  const items = state.cart.map(i=>({
    productId:i.productId, name:i.name, price:i.price, qty:i.qty,
    lineDiscount: i.lineDiscount, lineTotal: Math.round(lineGross(i)*discountRatio*100)/100
  }));
  if(state.business.stockTrackingEnabled){
    state.cart.forEach(i=>{
      const p = state.products.find(x=>x.id===i.productId);
      if(p && p.trackStock) p.stock = Math.max(0, p.stock - i.qty);
    });
  }
  const sale = {
    id: uid(), time: new Date(), staffName: state.currentStaff?.name || 'Unknown', customerId: cust?cust.id:null,
    items, orderDiscount: state.orderDiscount, discountTotal: totals.discountAmt,
    exVat: totals.exVat, vat: totals.vat, total: due, grossBeforeRedemption: totals.total,
    method, tendered, change, splitCash, splitCard, wayShares, cashNet,
    pointsEarned, pointsRedeemedValue: redemptionValue,
    refunds: [], refundedTotal: 0, receiptChoice: co.receiptChoice
  };
  state.sales.push(sale);
  state.receipt = sale;
  state.checkout.open = false;
  state.cart = []; state.orderDiscount = {type:'none',value:0,reason:''}; state.activeCustomerId = null;
  render();
}
function renderCheckoutModal(){

  if(co.tab==='cash'){

    body = `

  } else if(co.tab==='card'){
    body = co.processing ? `
      <div class="card-sim"><div class="spinner"></div><p style="font-size:13px;color:var(--text-soft);">Processing card payment…</p></div>` : `
      <div class="card-sim">
        <div class="cico">CARD</div>

        <button class="btn btn-primary btn-lg btn-block" onclick="simulateCardPayment()">Confirm card payment</button>
      </div>`;
  } else if(co.tab==='split'){
    const card = Math.max(0, due - co.splitCash);
    body = `
      <div class="field">
        <label>Cash amount</label>
        <input type="number" step="0.01" min="0" max="${due}" value="${co.splitCash}" oninput="onSplitCashInput(this)">

        <label>Card amount (remaining)</label>

      </div>
      <button class="btn btn-primary btn-lg btn-block" id="confirm-split-btn" onclick="completeSale('split')">Confirm split payment</button>`;
  } else if(co.tab==='ways'){
    if(!co.wayShares) buildWayShares();
    body = `
      <div class="way-mode-row">
        <button class="chip ${co.wayMode==='even'?'sel-primary':''}" onclick="setWayMode('even')">Split evenly</button>

      </div>
      <div class="way-count-row">
        <button onclick="changeWayCount(-1)">−</button>
        <div class="n">${co.wayCount}</div>
        <button onclick="changeWayCount(1)">+</button>
        <span style="font-size:12.5px;color:var(--text-soft);">guests</span>
      </div>
      ${co.wayMode==='item' ? `
      <div style="margin-bottom:14px;max-height:150px;overflow-y:auto;">

            </div>
          </div>`).join('')}
      </div>` : ''}
      <div style="max-height:260px;overflow-y:auto;">
        ${(co.wayShares||[]).map((s,i)=>`
          <div class="share-card ${s.paid?'paid':''}">
            <div class="sn">Guest ${s.guest}${s.paid?' ✓ paid ('+s.method+')':''}</div>
            <div class="sa">${fmtMoney(s.amount)}</div>
            ${!s.paid ? `<div class="sbtns"><button class="btn btn-secondary btn-sm" onclick="paySlice(${i},'cash')">Cash</button><button class="btn btn-primary btn-sm" onclick="paySlice(${i},'card')">Card</button></div>`:''}
          </div>`).join('')}
      </div>`;
  }
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeCheckout()">
    <div class="modal">
      <div class="modal-head"><h2>Checkout</h2><button class="close" onclick="closeCheckout()">✕</button></div>
      <div class="modal-body">
        <div class="due-box">
          <div class="lbl">Amount due</div>
          <div class="amt">${fmtMoney(due)}</div>
          ${co.redeemPoints ? `<div class="sub">${fmtMoney(totals.total)} less ${fmtMoney(Math.min(totals.total,redemptionValue))} in points</div>`:''}

        <div class="loyalty-row">
          <span>${esc(cust.name)} has <strong>${cust.loyaltyPoints} pts</strong> (worth ${fmtMoney(redemptionValue)})</span>

        <div class="pay-tabs">
          <button class="pay-tab ${co.tab==='cash'?'active':''}" onclick="setPayTab('cash')">Cash</button>

          <button class="pay-tab ${co.tab==='ways'?'active':''}" onclick="setPayTab('ways')">Split ways</button>
        </div>
        ${body}
      </div>
    </div>
  </div>`;
}

/* ============================ RECEIPT ============================ */
function renderReceiptModal(){
  const s = state.receipt; const b = state.business; const r = b.receipt;
  const brandLvl = brandStage('receipt');
  const showLogo = brandLvl!=='subtle' && r.showLogo;
  const banner = brandLvl==='bold' ? brandImg('receiptBanner') : null;
  let payLine;
  if(s.method==='cash') payLine = `Cash · Tendered ${fmtMoney(s.tendered)} · Change ${fmtMoney(s.change)}`;
  else if(s.method==='card') payLine = 'Card payment';
  else if(s.method==='split') payLine = `Split · Cash ${fmtMoney(s.splitCash)} + Card ${fmtMoney(s.splitCard)}`;
  else payLine = `Split ${s.wayShares.length} ways · ${s.wayShares.map(w=>fmtMoney(w.amount)+' ('+w.method+')').join(', ')}`;
  const cust = state.customers.find(c=>c.id===s.customerId);
  return `
  <div class="modal-overlay">
    <div class="modal" style="max-width:${r.width==='58mm'?'320px':'380px'};">
      <div class="modal-head"><h2>Sale complete</h2><button class="close" onclick="closeReceipt()">✕</button></div>
      <div class="modal-body" style="padding-top:0;">
        <div id="receipt-print" class="receipt" style="max-width:${r.width==='58mm'?'240px':'320px'};${brandLvl==='bold'?`border-top:4px solid ${b.primaryColor};`:''}">
          ${banner ? `<img src="${banner}" alt="" style="width:100%;display:block;margin-bottom:10px;object-fit:cover;max-height:90px;">` : ''}
          <div class="receipt-head">
            ${showLogo ? `<div class="receipt-logo">${logoNode()}</div>` : ''}
            <div class="bn">${esc(b.name)}</div>
            ${r.showAddress && r.address ? `<div class="meta">${esc(r.address)}</div>`:''}
            ${r.showAddress && r.phone ? `<div class="meta">${esc(r.phone)}</div>`:''}
            <div class="meta">${s.time.toLocaleString('en-GB')}<br>Served by ${esc(s.staffName)}${cust?` · ${esc(cust.name)}`:''}</div>
          </div>
          <div class="receipt-div"></div>
          ${s.items.map(i=>`<div class="receipt-line"><span class="nm">${esc(i.qty)} × ${esc(i.name)}</span><span>${fmtMoney(i.lineTotal!=null?i.lineTotal:i.price*i.qty)}</span></div>`).join('')}
          <div class="receipt-div"></div>
          ${s.discountTotal>0?`<div class="receipt-tot"><span>Discount</span><span>−${fmtMoney(s.discountTotal)}</span></div>`:''}
          ${s.pointsRedeemedValue>0?`<div class="receipt-tot"><span>Loyalty points redeemed</span><span>−${fmtMoney(s.pointsRedeemedValue)}</span></div>`:''}
          <div class="receipt-tot"><span>Subtotal</span><span>${fmtMoney(s.exVat)}</span></div>
          <div class="receipt-tot"><span>VAT</span><span>${fmtMoney(s.vat)}</span></div>
          <div class="receipt-tot grand"><span>Total</span><span>${fmtMoney(s.total)}</span></div>
          <div class="receipt-div"></div>
          <div class="receipt-tot"><span>${payLine}</span></div>
          ${s.pointsEarned>0?`<div class="receipt-tot"><span>Points earned this visit</span><span>+${s.pointsEarned}</span></div>`:''}
          <div class="receipt-foot">${esc(r.footer||'Thank you for your visit!')}<br>— ${esc(b.name)} —</div>
          <div class="perf"></div>
        </div>
        <div class="receipt-choice-row">
          <button class="btn btn-secondary" onclick="printReceipt()">Print</button>
          <button class="btn btn-secondary" onclick="emailReceipt()">Email</button>
          <button class="btn btn-primary" onclick="closeReceipt()">No receipt / Done</button>
        </div>
      </div>
    </div>
  </div>`;
}
function printReceipt(){ state.receipt.receiptChoice='print'; window.print(); }
function emailReceipt(){
  const cust = state.customers.find(c=>c.id===state.receipt.customerId);
  const suggested = cust?.email || '';
  const email = prompt('Send receipt to which email address?', suggested);
  if(!email) return;
  state.receipt.receiptChoice = 'email';
  toast(`Receipt emailed to ${email} (simulated).`);
}
function closeReceipt(){ state.receipt=null; render(); }

}

function cpHandleBrandImageUpload(input, key){
